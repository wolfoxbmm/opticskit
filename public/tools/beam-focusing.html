<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>光束聚焦计算器 - OpticsKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" crossorigin="anonymous"></script>
<style>
:root{--bg-root:#F3F4F6;--bg-surface:#FFFFFF;--bg-elevated:#F9FAFB;--bg-hover:#F3F4F6;--border-subtle:#E5E7EB;--text-primary:#111827;--text-secondary:#4B5563;--text-tertiary:#6B7280;--text-disabled:#9CA3AF;--accent:#2563EB;--accent-hover:#1D4ED8;--accent-light:#EFF6FF;--shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 4px 12px rgba(0,0,0,0.06);--radius-sm:8px;--radius-md:12px;--radius-full:9999px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-root);color:var(--text-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.01em;line-height:1.6}
.app{max-width:1100px;margin:0 auto;padding:12px 12px 8px}
.hd{text-align:center;margin-bottom:6px}
.hd h1{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.hd p{font-size:11px;color:var(--text-tertiary);margin-top:1px}

.main-layout{display:flex;gap:10px;align-items:stretch}
.col-params{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.col-chart{flex:1;min-width:0}

.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px;box-shadow:var(--shadow-sm)}

.param-grp{margin-bottom:3px}
.param-grp label{font-size:9px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:1px}
.param-grp input{font-size:12px;padding:5px 8px;border:1px solid var(--border-subtle);border-radius:6px;background:var(--bg-elevated);color:var(--text-primary);outline:none;font-family:inherit;width:100%;transition:border-color .2s}
.param-grp input:focus{border-color:var(--accent);background:var(--bg-surface)}
.param-unit{font-size:8px;color:var(--text-disabled);margin-top:1px}

.btn{font-size:11px;font-weight:600;padding:5px 12px;border:none;border-radius:var(--radius-full);cursor:pointer;transition:all .2s;font-family:inherit;width:100%}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent-hover)}

.presets{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.preset{font-size:8px;padding:2px 7px;border:1px solid var(--border-subtle);border-radius:var(--radius-full);background:var(--bg-surface);color:var(--text-secondary);cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.3}
.preset:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

.chart-wrap{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px;box-shadow:var(--shadow-sm)}
.chart-box{width:100%;height:340px}

.rslt-header{font-size:9px;font-weight:650;margin-bottom:6px;color:var(--text-secondary)}
.r-item{border-bottom:1px solid var(--bg-hover);padding:2px 0}
.r-item:last-child{border-bottom:none}
.r-item .rl{font-size:8px;color:var(--text-disabled);text-transform:uppercase;letter-spacing:0.02em}
.r-item .rv{font-size:13px;font-weight:700;color:var(--text-primary);margin-top:1px}
.r-item .ru{font-size:8px;color:var(--text-tertiary)}
.r-item .sub{font-size:8px;color:var(--text-disabled)}
.r-highlight .sub{font-size:8px;color:var(--text-tertiary)}

.r-highlight{background:var(--accent-light);border-radius:6px;padding:4px 8px;margin:4px 0;border-left:3px solid var(--accent)}
.r-highlight .rv{font-size:15px;font-weight:700;color:var(--accent)}

.warn{font-size:8px;padding:3px 8px;border-radius:4px;margin-top:4px}
.warn-ok{background:#ECFDF5;color:#059669}
.warn-caution{background:#FFFBEB;color:#D97706}
.warn-danger{background:#FEE2E2;color:#DC2626}

@media(max-width:800px){.main-layout{flex-direction:column}.col-params{width:100%}.chart-box{height:300px}}
</style>
</head>
<body>
<div class="app">
<div class="hd">
  <h1>光束聚焦计算器</h1>
  <p>高斯光束薄透镜聚焦 · 焦点光斑 · 焦深 · 峰值功率密度</p>
</div>

<div class="main-layout">
  <div class="col-params">
    <div class="card">
      <div class="param-grp">
        <label>波长 λ</label>
        <input type="number" id="lambda" value="1064" step="any" oninput="debounceCalc()">
        <div class="param-unit">nm</div>
      </div>
      <div class="param-grp">
        <label>入射光斑半径 w_in</label>
        <input type="number" id="wIn" value="3" step="any" oninput="debounceCalc()">
        <div class="param-unit">mm (1/e² 半径)</div>
      </div>
      <div class="param-grp">
        <label>透镜焦距 f</label>
        <input type="number" id="focal" value="100" step="any" oninput="debounceCalc()">
        <div class="param-unit">mm</div>
      </div>
      <div class="param-grp">
        <label>光束质量 M²</label>
        <input type="number" id="m2" value="1" step="0.1" min="1" oninput="debounceCalc()">
      </div>
      <div class="param-grp">
        <label>激光功率 P</label>
        <input type="number" id="power" value="10" step="any" min="0" oninput="debounceCalc()">
        <div class="param-unit">W（可选，计算功率密度）</div>
      </div>
      <button class="btn btn-p" onclick="calculate()">计算</button>
      <div class="presets">
        <button class="preset" onclick="setPreset(1064,3,100,1,10)">Nd:YAG 打标</button>
        <button class="preset" onclick="setPreset(10640,5,200,1,100)">CO₂ 切割</button>
        <button class="preset" onclick="setPreset(355,1,50,1.2,3)">紫外精细</button>
        <button class="preset" onclick="setPreset(532,2,30,1.1,5)">绿光微加工</button>
        <button class="preset" onclick="setPreset(1550,0.8,15,1,0.1)">光纤准直</button>
      </div>
    </div>

    <div class="card" id="resultsCard"></div>
  </div>

  <div class="col-chart">
    <div class="chart-wrap">
      <div class="chart-box" id="chart"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-disabled);font-size:13px">加载中…</div></div>
    </div>
  </div>
</div>
</div>

<script>
let chart;
let currentG={};

function $(id){return document.getElementById(id)}
function fmt(v,d){if(v==null||isNaN(v))return'—';const dd=d!=null?d:3;if(v===0)return'0';const av=Math.abs(v);if(av>=1e6||(av>0&&av<0.0001))return v.toExponential(dd);return v.toFixed(dd)}

let calcTimer;
function debounceCalc(){clearTimeout(calcTimer);calcTimer=setTimeout(calculate,200)}
function setPreset(l,w,f,m,p){$('lambda').value=l;$('wIn').value=w;$('focal').value=f;$('m2').value=m;$('power').value=p;calculate()}

function calculate(){
  const lNm=parseFloat($('lambda').value)||1064;
  const wIn=parseFloat($('wIn').value)||3;
  const f=parseFloat($('focal').value)||100;
  const m2=parseFloat($('m2').value)||1;
  const pwr=parseFloat($('power').value)||0;
  if(lNm<=0||wIn<=0||f<=0||m2<1)return;

  const lmm=lNm*1e-6; // wavelength in mm

  // Input beam: Rayleigh range, divergence
  const zRin_mm=Math.PI*wIn*wIn/(lmm*m2);
  const div_mrad=m2*lmm/(Math.PI*wIn)*1000;
  // Focused spot at lens focal plane (collimated input assumption)
  const wf_mm=m2*lmm*f/(Math.PI*wIn);
  const wf_um=wf_mm*1000;
  const zRf_mm=Math.PI*wf_mm*wf_mm/(lmm*m2);
  const dof_mm=2*zRf_mm;
  const area_um2=Math.PI*wf_um*wf_um;
  const fNum=f/(2*wIn);
  // Peak intensity
  let peakText='—';
  if(pwr>0){
    const iWcm2=2*pwr/(Math.PI*wf_mm*wf_mm)*100; // 2P/(πwf²) = W/mm², *100 = W/cm²
    peakText=iWcm2>=1e6?fmt(iWcm2/1e6,2)+' MW/cm²':iWcm2>=1e3?fmt(iWcm2/1e3,2)+' kW/cm²':fmt(iWcm2,1)+' W/cm²';
  }

  currentG={wf_um,wf_mm,zRf_mm,dof_mm,area_um2,fNum,zRin_mm,div_mrad,f,wIn,lmm,m2,pwr,peakText,lNm};

  // Results
  $('resultsCard').innerHTML=`
    <div class="rslt-header">📊 聚焦结果</div>
    <div class="r-highlight">
      <div style="font-size:8px;color:var(--text-disabled);text-transform:uppercase;letter-spacing:0.02em">焦点光斑半径 w_f</div>
      <div class="rv">${fmt(wf_um,1)} μm</div>
      <div class="sub">直径 ${fmt(wf_um*2,1)} μm · 面积 ${fmt(area_um2,0)} μm²</div>
    </div>
    <div class="r-item"><div class="rl">焦深 DOF</div><div class="rv">${dof_mm>=0.01?fmt(dof_mm,3)+' mm':fmt(dof_mm*1000,1)+' μm'}</div><div class="ru">瑞利范围的2倍</div></div>
    ${pwr>0?`<div class="r-item"><div class="rl">峰值功率密度 I₀</div><div class="rv">${peakText}</div><div class="ru">2P/πw_f²</div></div>`:''}
    <div class="r-item"><div class="rl">F 数</div><div class="rv">${fmt(fNum,1)}</div><div class="ru">f / D</div></div>
    <div class="r-item"><div class="rl">入射发散角</div><div class="rv">${fmt(div_mrad,2)} mrad</div><div class="ru">半角 M²λ/πw</div></div>
    <div class="warn warn-${area_um2<100?'ok':area_um2<1000?'caution':'danger'}">${area_um2<100?'🟢 亚衍射极限聚焦':area_um2<1000?'🟡 典型微加工尺度':'🔴 光斑偏大，检查参数'}</div>
  `;

  renderChart();
}

function renderChart(){
  const dom=$('chart');
  const ph=dom.querySelector('div:first-child');
  if(ph)ph.style.display='none';
  if(chart){chart.dispose();chart=null;}

  const{f,wf_mm,wf_um,zRf_mm}=currentG;
  if(!f||f<=0)return;

  // X range: from lens (z=0) to beyond focal plane (z=f + 5zR)
  const zStart=0;
  const zEnd=Math.max(f+5*zRf_mm,f*1.1);
  const N=400;
  const zVals=[],wVals=[];
  for(let i=0;i<=N;i++){
    const z=zStart+(zEnd-zStart)*i/N;
    const dz=z-f;
    const w=zRf_mm>0?wf_mm*Math.sqrt(1+(dz*dz)/(zRf_mm*zRf_mm)):wf_mm;
    zVals.push(z);
    wVals.push(w*1000);
  }

  // w at z=0 (lens position): large beam
  const wAtLens=zRf_mm>0?wf_mm*Math.sqrt(1+(f*f)/(zRf_mm*zRf_mm))*1000:wf_um;
  const yMax=Math.max(wAtLens*1.1,wf_um*5,15);

  // 预先构建数据
  const chartData=zVals.map(function(_,i){return[zVals[i],wVals[i]]});

  chart=echarts.init(dom);

  chart.setOption({
    tooltip:{
      trigger:'axis',
      formatter:function(ps){
        var zz=ps[0].data[0];
        var dz=zz-f;
        var prefix=dz>=0?'距焦点后 ':'距焦点前 ';
        return '<b>z='+fmt(zz,1)+' mm ('+prefix+fmt(Math.abs(dz),2)+' mm)</b><br/>'+ps[0].marker+'w(z)='+fmt(ps[0].data[1],1)+' μm';
      }
    },
    legend:{show:false},
    grid:{left:75,right:20,top:16,bottom:45},
    xAxis:{type:'value',name:'距透镜距离 z (mm)',nameLocation:'center',nameGap:28,
      nameTextStyle:{fontSize:10,color:'#6B7280'},axisLabel:{fontSize:8,color:'#9CA3AF'},splitLine:{show:false}
    },
    yAxis:{type:'value',name:'w(z) (μm)',nameLocation:'center',nameGap:45,nameRotate:90,nameTextStyle:{fontSize:10,color:'#6B7280'},axisLabel:{fontSize:8,color:'#9CA3AF'},splitLine:{lineStyle:{color:'#F3F4F6'}},
      min:0,max:yMax
    },
    series:[{
      name:'w(z)',type:'line',data:chartData,symbol:'none',smooth:true,
      lineStyle:{color:'#2563EB',width:2.5},
      markLine:{silent:true,symbol:'none',
        lineStyle:{color:'#F59E0B',width:1.5,type:'dashed'},
        label:{show:true,position:'end',formatter:'焦平面 z=f',fontSize:8,color:'#F59E0B'},
        data:[{xAxis:f}]
      },
      markArea:{silent:true,
        data:[[{xAxis:f-zRf_mm,itemStyle:{color:'rgba(37,99,235,0.05)'}},{xAxis:f+zRf_mm}]],
        label:{show:false}
      },
      markPoint:{silent:true,
        data:[{name:'束腰',coord:[f,wf_um],symbol:'circle',symbolSize:12,
          itemStyle:{color:'#DC2626',borderColor:'#fff',borderWidth:2.5},
          label:{show:true,formatter:'w_f='+fmt(wf_um,1)+'μm',fontSize:9,color:'#DC2626',position:'top',distance:8}
        }]
      }
    }]
  });
}

window.addEventListener('resize',function(){chart&&chart.resize()});
setTimeout(calculate,300);
</script>
</body>
</html>
