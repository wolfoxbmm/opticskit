<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="免费在线阿贝数计算器，内置 156 种 Schott 光学玻璃数据。支持 v_d 色散计算、部分色散 P_gF、ΔP 偏差分析和交互式 n_d-v_d 阿贝图。适用于光学设计选材与色散参数校核。">
<title>阿贝数计算器 - OpticsKit</title>
<style>
:root{--bg-root:#F3F4F6;--bg-surface:#FFFFFF;--bg-elevated:#F9FAFB;--bg-hover:#F3F4F6;--border-subtle:#E5E7EB;--text-primary:#111827;--text-secondary:#4B5563;--text-tertiary:#6B7280;--text-disabled:#9CA3AF;--accent:#2563EB;--green:#059669;--amber:#D97706;--red:#DC2626;--shadow-sm:0 1px 2px rgba(0,0,0,0.04);--radius-sm:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-root);color:var(--text-primary);-webkit-font-smoothing:antialiased;line-height:1.6}
.app{max-width:1060px;margin:0 auto;padding:12px}
.hd{text-align:center;margin-bottom:10px}
.hd h1{font-size:18px;font-weight:700}
.hd p{font-size:12px;color:var(--text-secondary)}
.main-layout{display:flex;gap:10px;align-items:flex-start}
.col-params{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.col-result{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px;box-shadow:var(--shadow-sm)}
.search-box{position:relative}
.search-box input{font-size:12px;padding:6px 28px 6px 10px;width:100%;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--bg-elevated);outline:none;font-family:inherit}
.search-box input:focus{border-color:var(--accent);background:var(--bg-surface)}
.search-box .clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;background:none;color:var(--text-disabled);font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;border-radius:50%;line-height:1;padding:0}
.search-box .clear-btn:hover{background:var(--bg-hover);color:var(--text-secondary)}
.search-box .clear-btn.show{display:flex}
.material-list{max-height:220px;overflow-y:auto;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);margin-top:4px}
.material-list .item{font-size:11px;padding:4px 10px;cursor:pointer;border-bottom:1px solid var(--bg-hover);display:flex;justify-content:space-between;transition:background .1s}
.material-list .item:hover{background:#EFF6FF}
.material-list .item:last-child{border-bottom:none}
.manual-input{border-top:1px solid var(--border-subtle);padding-top:6px;margin-top:6px}
.manual-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.manual-row label{font-size:10px;color:var(--text-secondary);width:30px;text-align:right}
.manual-row input{font-size:12px;padding:3px 6px;border:1px solid var(--border-subtle);border-radius:4px;background:var(--bg-elevated);outline:none;width:72px;font-family:inherit}
.manual-row input:focus{border-color:var(--accent)}
.manual-row span{font-size:10px;color:var(--text-tertiary);width:48px}
.material-list .item span{font-size:10px;color:var(--text-primary)}
.rslt-header{font-size:10px;font-weight:650;margin-bottom:6px;color:var(--text-secondary)}
.abbe-hl{background:#EFF6FF;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:8px;display:flex;align-items:baseline;gap:16px;border-left:3px solid var(--accent)}
.abbe-hl .v-num{font-size:28px;font-weight:700;color:var(--accent)}
.abbe-hl .v-label{font-size:10px;color:var(--text-tertiary);margin-bottom:2px}
.abbe-hl .v-val{font-size:15px;font-weight:700}
.abbe-hl .v-class{font-size:10px;font-weight:600;padding:2px 10px;border-radius:999px;margin-left:auto;white-space:nowrap}
.cl-crown{background:#ECFDF5;color:var(--green)}
.cl-flint{background:#FEF3C7;color:var(--amber)}
.cl-heavy{background:#FEE2E2;color:var(--red)}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px}
.r-item{padding:5px 0;border-bottom:1px solid var(--bg-hover)}
.r-item .rl{font-size:10px;color:var(--text-secondary)}
.r-item .rv{font-size:14px;font-weight:700}
.r-item .ru{font-size:10px;color:var(--text-tertiary)}
.abbe-chart{width:100%;height:320px;background:var(--bg-elevated);border-radius:var(--radius-sm);border:1px solid var(--border-subtle);margin-top:6px}
.abbe-chart canvas{width:100%;height:100%}
.eq-note{font-size:10px;color:var(--text-tertiary);padding:8px 10px;background:var(--bg-elevated);border-radius:var(--radius-sm);line-height:1.8;margin-top:6px}
@media(max-width:800px){.main-layout{flex-direction:column}.col-params{width:100%}.r-grid{grid-template-columns:1fr}}
</style>
</head>

<div class="app">
<div class="hd"><h1>阿贝数 & 色散计算器</h1><p>v_d · P_gF · ΔP · n_d–v_d 阿贝图 · 内置主流光学玻璃库</p></div>
<div class="main-layout">
<div class="col-params"><div class="card">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索或输入玻璃名..." oninput="filterGlass();updateClearBtn()" onfocus="updateClearBtn()"><button class="clear-btn" id="clearBtn" onclick="clearGlass()" title="清除选择">✕</button></div>

<div class="manual-row"><label>n_C</label><input type="number" id="n_C" value="1.5143" step="0.00001" oninput="calcAbbe()"><span>656.3nm</span></div>
<div class="manual-row"><label>n_g</label><input type="number" id="n_g" value="" step="0.00001" oninput="calcAbbe()" placeholder="可选"><span>435.8nm</span></div>
</div></div></div>
<div class="col-result">
<div class="card" id="resultsCard"></div>
<div class="card"><div class="rslt-header">📈 n_d – v_d 阿贝图</div><div class="abbe-chart"><canvas id="abbeCanvas"></canvas></div></div>
</div></div></div>

// 156 glasses

let GLASS_DB = GLASS_DATA.map(g => ({...g, formula: ""}));
let curGlass = null;

function $(id){return document.getElementById(id)}
function fmt(v,d){if(v==null||isNaN(v))return'—';return Number(v).toFixed(d!=null?d:2)}

// Glass family tags based on name prefix (Schott convention)
function glassFamily(name){
  const n=name;
  if(/^(?:N-|P-)?(?:FK|PK|PSK|BK|K\d|ZK|SK|SSK|BAK|LAK)/.test(n)) return['冕牌','cl-crown'];
  if(/^(?:N-|P-)?(?:KZFS|KZFSN|LLF|LF|BALF|BAF|KF|F\d)/.test(n)) return['火石','cl-flint'];
  if(/^(?:N-|P-)?(?:SF|SFL|LAF|LASF|BASF|LAFN)/.test(n)) return['重火石','cl-heavy'];
  return ['',''];
}

function initGlasses(){
  // GLASS_DB already populated with nd/vd from inline GLASS_DATA
  renderGlassList();
  calcAbbe();
}

function renderGlassList(filter){
  const el=$('materialList');
  let list=GLASS_DB;
  if(filter){
    const f=filter.toLowerCase();
    list=GLASS_DB
      .filter(g=>g.name.toLowerCase().includes(f)||g.id.toLowerCase().includes(f))
      .map(g=>{
        const nl=g.name.toLowerCase();
        let score=0;
        if(nl===f)score=100;              // exact match
        else if(nl.startsWith(f))score=80; // prefix match
        else if(nl.includes('-'+f))score=60; // segment match (e.g. N-SF6 matches SF6)
        else score=50;                     // substring match
        return{g,score};
      })
      .sort((a,b)=>b.score-a.score||a.g.name.localeCompare(b.g.name))
      .map(x=>x.g);
  }
  if(!list.length){el.innerHTML='<div class="item" style="color:var(--text-disabled);justify-content:center">无匹配玻璃</div>';return}
  el.innerHTML=list.map(g=>{
    const a=curGlass&&curGlass.id===g.id?'background:#EFF6FF;':'';
    const vdText=g.vd?'v_d='+fmt(g.vd,1):'加载中...';
    const [fam,fc]=glassFamily(g.name);
    const famTag=fam?`<span style="font-size:9px;color:var(--text-disabled);margin:0 4px">${fam}</span>`:'';
    return `<div class="item" style="${a}" onclick="selectGlass('${g.id}')"><span style="font-weight:500">${g.name}${famTag}</span><span style="color:var(--text-tertiary);font-size:10px">${vdText}</span></div>`;
  }).join('');
}

function filterGlass(){renderGlassList($('searchInput').value.trim()||null)}

function updateClearBtn(){
  const v=$('searchInput').value.trim();
  $('clearBtn').classList.toggle('show',v.length>0);
}

function clearGlass(){
  curGlass=null;
  $('searchInput').value='';
  $('clearBtn').classList.remove('show');
  renderGlassList();
  // Reset to default demo values
  $('n_d').value='1.5168';$('n_F').value='1.5224';$('n_C').value='1.5143';$('n_g').value='';
  calcAbbe();
}

// Keyboard navigation for glass list
let kbIdx=-1;
$('searchInput').addEventListener('keydown',function(e){
  const items=$('materialList').querySelectorAll('.item');
  if(e.key==='ArrowDown'){e.preventDefault();kbIdx=Math.min(kbIdx+1,items.length-1);highlightKb(items);return}
  if(e.key==='ArrowUp'){e.preventDefault();kbIdx=Math.max(kbIdx-1,0);highlightKb(items);return}
  if(e.key==='Enter'){if(kbIdx>=0&&items[kbIdx]){items[kbIdx].click();kbIdx=-1;return}}
  kbIdx=-1;
});
function highlightKb(items){items.forEach((it,i)=>{it.style.background=i===kbIdx?'#EFF6FF':(curGlass&&it.onclick&&it.textContent.includes(curGlass.name)?'#EFF6FF':'')})}

async function selectGlass(id){
  const g = GLASS_DB.find(x => x.id === id);
  if(!g || !g.nd) return;
  curGlass = g;
  $('searchInput').value = g.name;
  updateClearBtn();
  // Calculate nF, nC from nd and vd
  $('n_d').value = fmt(g.nd, 5);
  const delta = (g.nd - 1) / g.vd;
  $('n_F').value = fmt(g.nd + delta * 0.55, 5);
  $('n_C').value = fmt(g.nd - delta * 0.45, 5);
  $('n_g').value = '';
  
  renderGlassList($('searchInput').value.trim()||null);
  calcAbbe();
}

function calcAbbe(){
  const nd = parseFloat($('n_d').value)||0, nF = parseFloat($('n_F').value)||0;
  const nC = parseFloat($('n_C').value)||0, ng = parseFloat($('n_g').value)||null;
  
  if(nd<=1||nF<=1||nC<=1){$('resultsCard').innerHTML='<div style="padding:20px;text-align:center;color:var(--text-disabled)">请输入有效折射率（n &gt; 1）</div>';drawChart(null);return}
  const delta = nF - nC;
  if(delta<=0){$('resultsCard').innerHTML='<div style="padding:20px;text-align:center;color:var(--text-disabled)">⚠ n_F 需大于 n_C（正常色散材料）</div>';drawChart(null);return}
  
  const vd = (nd-1)/delta;
  const PgF = ng ? (ng-nF)/delta : null;
  const PgFn = 0.6438 - 0.001682*vd;
  const deltaP = PgF!==null ? PgF-PgFn : null;
  
  let gc,cs;
  if(vd>=55&&nd<1.60){gc='冕牌';cs='cl-crown'}
  else if(vd>=50&&nd<1.60){gc='轻火石';cs='cl-crown'}
  else if(vd>=35){gc='火石';cs='cl-flint'}
  else{gc='重火石';cs='cl-heavy'}
  
  let h = '<div class="rslt-header">📊 色散计算结果</div>';
  h += `<div class="abbe-hl"><div><div class="v-label">阿贝数 v<sub>d</sub></div><div class="v-num">${fmt(vd,1)}</div></div><div style="flex:1"><div class="v-label">n<sub>d</sub></div><div class="v-val">${fmt(nd,4)}</div></div><div style="flex:1"><div class="v-label">n<sub>F</sub>−n<sub>C</sub></div><div class="v-val">${fmt(delta,5)}</div></div><span class="v-class ${cs}">${gc}</span></div>`;
  
  h += '<div class="r-grid">';
  h += `<div class="r-item"><div class="rl">n<sub>d</sub></div><div class="rv">${fmt(nd,5)}</div><div class="ru">d线 587.6nm (He)</div></div>`;
  h += `<div class="r-item"><div class="rl">n<sub>F</sub></div><div class="rv">${fmt(nF,5)}</div><div class="ru">F线 486.1nm (H)</div></div>`;
  h += `<div class="r-item"><div class="rl">n<sub>C</sub></div><div class="rv">${fmt(nC,5)}</div><div class="ru">C线 656.3nm (H)</div></div>`;
  h += `<div class="r-item"><div class="rl">n<sub>F</sub>−n<sub>C</sub></div><div class="rv">${fmt(delta,5)}</div><div class="ru">主色散（中部色散）</div></div>`;
  h += `<div class="r-item"><div class="rl">阿贝数 v<sub>d</sub></div><div class="rv">${fmt(vd,2)}</div><div class="ru">(n<sub>d</sub>−1)/(n<sub>F</sub>−n<sub>C</sub>)</div></div>`;
  
  if(PgF!==null){
    h += `<div class="r-item"><div class="rl">部分色散 P<sub>gF</sub></div><div class="rv">${fmt(PgF,4)}</div><div class="ru">(n<sub>g</sub>−n<sub>F</sub>)/(n<sub>F</sub>−n<sub>C</sub>)</div></div>`;
    h += `<div class="r-item"><div class="rl">正常线 P<sub>gF</sub></div><div class="rv">${fmt(PgFn,4)}</div><div class="ru">Schott正常色散线</div></div>`;
    h += `<div class="r-item"><div class="rl">ΔP</div><div class="rv" style="color:${Math.abs(deltaP)>0.01?'var(--red)':'var(--green)'}">${fmt(deltaP,5)}</div><div class="ru">${Math.abs(deltaP)>0.01?'⚠异常色散':'✅正常色散'}</div></div>`;
  }
  h += '</div>';
  
  // Formula reference + disclaimer
  h += `<div class="eq-note"><b>参考公式 & 玻璃分类</b><br>阿贝数：v<sub>d</sub> = (n<sub>d</sub> − 1) / (n<sub>F</sub> − n<sub>C</sub>)<br>部分色散：P<sub>gF</sub> = (n<sub>g</sub> − n<sub>F</sub>) / (n<sub>F</sub> − n<sub>C</sub>)<br>正常线(Schott)：P<sub>gF</sub> ≈ 0.6438 − 0.001682·v<sub>d</sub><br>冕牌 v<sub>d</sub>≥55 | 火石 35≤v<sub>d</sub>&lt;55 | 重火石 v<sub>d</sub>&lt;35<br>⚠ 免责声明：选玻璃时 n<sub>F</sub>/n<sub>C</sub> 由 v<sub>d</sub> 反推估算（偏差 ~±0.001），精确值请参考玻璃厂商 datasheet。计算结果仅供参考，不构成工程设计依据。</div>`;
  
  $('resultsCard').innerHTML = h;
  
  // Collect all glasses with data for chart
  const chartPoints = GLASS_DB.filter(g => g.nd && g.vd).map(g => ({nd:g.nd, vd:g.vd, name:g.name, active:curGlass&&g.id===curGlass.id}));
  drawChart({nd, vd, name:curGlass?curGlass.name:'手动输入', allGlasses:chartPoints});
}

function drawChart(pt){
  const c=$('abbeCanvas'),r=c.parentElement.getBoundingClientRect();
  c.width=r.width*2;c.height=320*2;c.style.width=r.width+'px';c.style.height='320px';
  const ct=c.getContext('2d');ct.scale(2,2);
  const W=r.width,H=320,pad={t:20,r:35,b:40,l:50},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const xMin=20,xMax=100,yMin=1.38,yMax=2.10;
  function xf(v){return pad.l+(v-xMin)/(xMax-xMin)*pw}
  function yf(v){return pad.t+(yMax-v)/(yMax-yMin)*ph}
  
  ct.fillStyle='#F9FAFB';ct.fillRect(0,0,W,H);
  
  // Glass region shading
  ct.fillStyle='rgba(37,99,235,0.04)';ct.beginPath();
  ct.moveTo(xf(100),yf(1.42));ct.lineTo(xf(85),yf(1.44));ct.lineTo(xf(70),yf(1.49));
  ct.lineTo(xf(55),yf(1.55));ct.lineTo(xf(40),yf(1.65));
  ct.lineTo(xf(30),yf(1.78));ct.lineTo(xf(20),yf(2.05));ct.lineTo(xf(20),yf(1.42));ct.fill();
  
  // Grid
  ct.strokeStyle='#E5E7EB';ct.lineWidth=0.5;
  for(let v=20;v<=100;v+=20){ct.beginPath();ct.moveTo(xf(v),pad.t);ct.lineTo(xf(v),pad.t+ph);ct.stroke()}
  for(let n=1.4;n<=2.1;n+=0.1){ct.beginPath();ct.moveTo(pad.l,yf(n));ct.lineTo(pad.l+pw,yf(n));ct.stroke()}
  
  // Region labels
  ct.fillStyle='rgba(107,114,128,0.18)';ct.font='10px Inter,sans-serif';ct.textAlign='center';
  ct.fillText('冕牌玻璃 (Crown)',xf(75),yf(1.46));
  ct.fillText('火石玻璃 (Flint)',xf(45),yf(1.56));
  ct.fillText('重火石 (SF)',xf(28),yf(1.72));
  
  // Plot all loaded glasses as small dots
  if(pt && pt.allGlasses){
    pt.allGlasses.forEach(g => {
      if(g.vd>=xMin&&g.vd<=xMax&&g.nd>=yMin&&g.nd<=yMax){
        ct.beginPath();
        ct.arc(xf(g.vd),yf(g.nd), g.active?5:1.5, 0, Math.PI*2);
        ct.fillStyle = g.active ? '#2563EB' : 'rgba(156,163,175,0.55)';
        ct.fill();
        if(g.active){
          ct.strokeStyle='#fff';ct.lineWidth=2;ct.stroke();
        }
      }
    });
  }
  
  // Axes
  ct.fillStyle='#4B5563';ct.font='10px Inter,sans-serif';ct.textAlign='center';
  for(let v=20;v<=100;v+=20)ct.fillText(v,xf(v),pad.t+ph+15);
  ct.fillText('阿贝数 v_d ← 低色散                    高色散 →',pad.l+pw/2,pad.t+ph+32);
  ct.textAlign='right';
  for(let n=1.4;n<=2.1;n+=0.2)ct.fillText(n.toFixed(1),pad.l-5,yf(n)+3);
  ct.save();ct.translate(12,pad.t+ph/2);ct.rotate(-Math.PI/2);ct.textAlign='center';
  ct.fillText('折射率 n_d →',0,0);ct.restore();
  ct.strokeStyle='#9CA3AF';ct.lineWidth=1;
  ct.beginPath();ct.moveTo(pad.l,pad.t);ct.lineTo(pad.l,pad.t+ph);ct.stroke();
  ct.beginPath();ct.moveTo(pad.l,pad.t+ph);ct.lineTo(pad.l+pw,pad.t+ph);ct.stroke();
  
  // Label active point
  if(pt&&pt.nd>0&&pt.vd>0){
    const px=xf(pt.vd),py=yf(pt.nd);
    ct.fillStyle='#111827';ct.font='600 11px Inter,sans-serif';ct.textAlign='left';
    ct.fillText(pt.name,px+10,py-8);
    ct.fillStyle='#4B5563';ct.font='10px Inter,sans-serif';
    ct.fillText(`n_d=${fmt(pt.nd,4)}  v_d=${fmt(pt.vd,1)}`,px+10,py+6);
  }
}

initGlasses();
window.addEventListener('resize',()=>calcAbbe());
