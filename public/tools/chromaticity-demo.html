function canvasToDiagram(cx,cy){
  var rect=canvas.getBoundingClientRect(),x=cx-rect.left,y=cy-rect.top;
  var dp=getDiagramPoints(),xR=dp.xRange,yR=dp.yRange;
  var pw=rect.width-MARGIN*2,ph=rect.height-MARGIN*2;

  var r=[gamut.R[0],gamut.R[1]],g=[gamut.G[0],gamut.G[1]],b=[gamut.B[0],gamut.B[1]];
  var v0x=g[0]-r[0],v0y=g[1]-r[1],v1x=b[0]-r[0],v1y=b[1]-r[1],v2x=px-r[0],v2y=py-r[1];

// ═══ ΔE 色差计算 (CIE76) ═══
var deltaE_pt1 = null, deltaE_pt2 = null;

function calcDeltaE76(lab1, lab2) {
  var dL = lab1.L - lab2.L, da = lab1.a - lab2.a, db = lab1.b - lab2.b;
  return Math.sqrt(dL*dL + da*da + db*db);
}

function xyToLab(x, y, Yn) {
  Yn = Yn || 100;
  var t = xyToXYZ(x, y, Yn);
  return xyzToLab(t.X, t.Y, t.Z);
}

function xyzToLab(X, Y, Z) {
  // D65 参考白: Xn=95.047, Yn=100, Zn=108.883
  var Xn=95.047, Yn=100, Zn=108.883;
  function f(t) { return t > 0.008856 ? Math.pow(t, 1/3) : 7.787*t + 16/116; }
  var fx = f(X/Xn), fy = f(Y/Yn), fz = f(Z/Zn);
  return { L: 116*fy - 16, a: 500*(fx - fy), b: 200*(fy - fz) };
}

function updateDeltaE() {
  var deVal = document.getElementById('de-val');
  var dePt1 = document.getElementById('de-pt1');
  var dePt2 = document.getElementById('de-pt2');
  if (deltaE_pt1) {
    dePt1.textContent = '(' + deltaE_pt1.x.toFixed(4) + ', ' + deltaE_pt1.y.toFixed(4) + ')';
  } else { dePt1.textContent = '未选'; }
  if (deltaE_pt2) {
    dePt2.textContent = '(' + deltaE_pt2.x.toFixed(4) + ', ' + deltaE_pt2.y.toFixed(4) + ')';
  } else { dePt2.textContent = '未选'; }
  if (deltaE_pt1 && deltaE_pt2) {
    var lab1 = xyToLab(deltaE_pt1.x, deltaE_pt1.y);
    var lab2 = xyToLab(deltaE_pt2.x, deltaE_pt2.y);
    var de = calcDeltaE76(lab1, lab2);
    deVal.textContent = 'ΔE*ab = ' + de.toFixed(2);
    deVal.style.color = de < 1 ? '#00e676' : de < 3 ? '#ffd600' : '#ff6b00';
  } else {
    deVal.textContent = '—';
    deVal.style.color = '#00bfff';
  }
}
