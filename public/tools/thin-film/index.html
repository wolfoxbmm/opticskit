<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薄膜干涉模拟 · 多层膜 - Thin Film Interference</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    display: flex;
    gap: 32px;
    padding: 40px;
    max-width: 1340px;
    width: 100%;
  }

  /* ---- Control Panel ---- */
  .controls {
    background: #13131a;
    border-radius: 16px;
    padding: 28px;
    width: 400px;
    flex-shrink: 0;
    border: 1px solid #1e1e2a;
    overflow-y: auto;
    max-height: 90vh;
    scrollbar-width: thin;
    scrollbar-color: #1e1e2a #0a0a0f;
  }
  .controls h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #fff;
  }

    font-size: 11px;
    color: #555;
    margin-bottom: 20px;

  /* Mode toggle */

    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: #0a0a0f;
    border-radius: 8px;
    padding: 3px;

  .mode-btn {
    flex: 1;
    padding: 7px 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #666;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: #1a1a24;
    color: #fff;
  }

  /* Layer list header */

    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;

    font-size: 11px;

    letter-spacing: 0.5px;

  .btn-sm {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid #1e1e2a;
    background: #0a0a0f;
    color: #4fc3f7;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;

  .btn-sm:hover {
    background: #1a1a24;
    border-color: #4fc3f7;

  /* Layer card */
  .layer-card {
    background: #0a0a0f;

    padding: 12px 14px;

    align-items: center;

  .layer-card .layer-num .btn-del {
    font-size: 9px;
    color: #666;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;

  .layer-card .layer-num .btn-del:hover {
    color: #ff6b6b;
  }
  .layer-card .param-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .layer-card .param-row label {
    font-size: 10px;
    color: #666;
    white-space: nowrap;
    min-width: 22px;
  }
  .layer-card .param-row .val {
    font-size: 10px;
    color: #4fc3f7;
    font-weight: 600;
    min-width: 38px;
    text-align: right;
    background: rgba(79,195,247,0.08);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .layer-card input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #1e1e2a;
    outline: none;
    cursor: pointer;
  }
  .layer-card input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4fc3f7;
    border: 2px solid #0a0a0f;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(79,195,247,0.4);
  }

  /* Substrate */
  .substrate-section {
    margin-top: 10px;
    margin-bottom: 14px;
    background: #0a0a0f;
    border: 1px solid #252530;
    border-radius: 10px;
    padding: 12px 14px;

  .substrate-section .sub-label {
    font-size: 10px;
    color: #666;
    margin-bottom: 8px;
  }
  .substrate-section .param-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .substrate-section .param-row label {
    font-size: 10px;
    color: #666;
    white-space: nowrap;
    min-width: 22px;
  }
  .substrate-section .param-row .val {
    font-size: 10px;
    color: #ff8a65;
    font-weight: 600;
    min-width: 38px;
    text-align: right;
    background: rgba(255,138,101,0.08);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .substrate-section input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #1e1e2a;
    outline: none;
    cursor: pointer;
  }
  .substrate-section input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ff8a65;
    border: 2px solid #0a0a0f;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,138,101,0.4);

  /* Info rows */
  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #555;
    margin-bottom: 3px;

  .info-row .highlight {
    color: #ff8a65;
    font-weight: 500;
  }
  .info-row .highlight-blue {
    color: #4fc3f7;
    font-weight: 500;
  }
  .info-row .highlight-green {

    font-weight: 500;
  }

  .divider {
    border: none;
    border-top: 1px solid #1e1e2a;
    margin: 14px 0;

  .section-title {
    font-size: 11px;
    color: #555;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

    position: relative;
    width: 100%;

  .preset-select {

    border: 1px solid #1e1e2a;
    border-radius: 8px;
    background: #0a0a0f;
    color: #e0e0e0;
    font-size: 12px;
    font-family: inherit;

    appearance: none;
    -webkit-appearance: none;

  .preset-select option { background: #13131a; color: #e0e0e0; padding: 8px; }
  .preset-select-wrapper::after {
    content: '▾';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #666;
    font-size: 10px;
    pointer-events: none;
  }

  /* ---- Chart Area ---- */
  .chart-area {
    flex: 1;
    background: #13131a;
    border-radius: 16px;
    border: 1px solid #1e1e2a;
    padding: 24px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .chart-area h3 {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .chart-area .chart-subtitle {
    font-size: 11px;
    color: #555;
    margin-bottom: 12px;
  }
  .chart-area canvas {
    flex: 1;
    width: 100%;
    border-radius: 8px;
    background: #0a0a0f;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    font-size: 10px;
    color: #888;
    flex-wrap: wrap;
  }
  .legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend .dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

<body>

<div class="container">
  <!-- Controls -->
  <div class="controls" id="controlsPanel">
    <h2>薄膜干涉</h2>
    <p class="subtitle">Thin Film Interference · 传输矩阵法 (TMM)</p>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="spectrum">反射光谱</button>
      <button class="mode-btn" data-mode="thickness">厚度扫描</button>
    </div>

    <!-- Dynamic layer list -->
    <div class="layer-header">
      <span class="section-title">膜层结构</span>
      <button class="btn-sm" id="btnAddLayer">+ 添加膜层</button>
    </div>
    <div id="layerList"></div>

    <!-- Substrate -->
    <div class="substrate-section">
      <div class="sub-label">🪨 基底 (Substrate)</div>
      <div class="param-row">
        <label>n<sub>sub</sub></label>
        <input type="range" id="nSub" min="1.0" max="5.0" step="0.01" value="1.52">
        <span class="val" id="nSubVal" data-kind="nSub" data-min="1.0" data-max="5.0" data-step="0.01" data-decimals="2" style="cursor:pointer" title="点击输入精确数值">1.52</span>
      </div>
    </div>

    <!-- Thickness scan layer selector -->
    <div id="thicknessScanLayer" style="display:none; margin-bottom:14px;">
      <div class="section-title" style="margin-bottom:6px;">扫描目标</div>
      <select id="scanLayerSelect" class="preset-select" style="font-size:11px;"></select>
    </div>

    <!-- Info -->
    <div class="info-row">
      <span>裸基底 R @ 550nm</span>
      <span class="highlight-green" id="bareR">4.26%</span>
    </div>
    <div class="info-row" id="infoMinR" style="display:none">
      <span>最小 R @ <span id="minRLambda" class="highlight">550 nm</span></span>
      <span class="highlight" id="minRVal">—</span>
    </div>
    <div id="explainArea"></div>

    <hr class="divider">

    <p class="section-title">预设场景</p>
    <div class="preset-select-wrapper">
      <select class="preset-select" id="presetSelect">
        <optgroup label="—— 经典单层 ——">
          <option value="mgh2">MgF₂ 单层增透 / BK7</option>
          <option value="arIdeal">理想增透膜 n₁=√(n₀n₂)</option>
          <option value="soap">肥皂泡（水膜/空气）</option>
        </optgroup>
        <optgroup label="—— 多层膜 ——">
          <option value="ar2layer">双层增透膜 (MgF₂/ZrO₂)</option>
          <option value="hr3layer">3层高反膜 (LH)</option>
          <option value="filter5">5层宽光谱增透膜 (HLHLH)</option>
          <option value="vcoat">"V" 型增透膜 (2层)</option>
        </optgroup>
        <optgroup label="—— 高折射率 ——">
          <option value="tio2">TiO₂ / BK7（单层高反）</option>
          <option value="zns_ge">ZnS / Ge（红外基底）</option>
        </optgroup>
      </select>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-area">
    <h3 id="chartTitle">反射率 vs 波长</h3>
    <p class="chart-subtitle" id="chartSubtitle">380 – 780 nm 可见光波段</p>
    <canvas id="chart"></canvas>
    <div class="legend" id="legendBar">
      <span><span class="dot" style="background:#4fc3f7"></span> 当前膜系</span>
      <span><span class="dot" style="background:#333"></span> 裸基底（无膜）</span>
    </div>
  </div>
</div>

<script>
// ============ Physics Engine: Transfer Matrix Method ============

/**
 * Compute complex reflectance amplitude r for a multilayer stack at normal incidence.
 * layers: [{ n, d }] from air to substrate. nSub: substrate refractive index.
 * Returns { R, r_complex } where R = |r|².
 */
function tmmReflectance(lambda, layers, nSub) {
  const n0 = 1.0; // air
  // Start with identity matrix
  let M11 = 1, M12 = 0, M21 = 0, M22 = 1;

  for (const layer of layers) {
    const n = layer.n;
    const d = layer.d;
    const delta = (2 * Math.PI * n * d) / lambda;
    const cosD = Math.cos(delta);
    const sinD = Math.sin(delta);
    // Characteristic matrix for this layer
    const m11 = cosD;
    const m12 = sinD / n;
    const m21 = n * sinD;
    const m22 = cosD;
    // Multiply M = M * layerMatrix
    const a11 = M11 * m11 + M12 * m21;
    const a12 = M11 * m12 + M12 * m22;
    const a21 = M21 * m11 + M22 * m21;
    const a22 = M21 * m12 + M22 * m22;
    M11 = a11; M12 = a12; M21 = a21; M22 = a22;
  }

  // Reflection amplitude
  const denom = M11 * nSub + M12 * n0 * nSub + M21 + M22 * n0;
  if (Math.abs(denom) < 1e-12) return { R: 1, r: { re: 0, im: 0 } };
  const r_re = (M11 * nSub + M12 * n0 * nSub - M21 - M22 * n0) / denom;
  const r_im = 0; // real for lossless dielectrics at normal incidence
  const R = r_re * r_re;
  return { R, r: { re: r_re, im: r_im } };
}

function reflectanceBare(lambda, nSub) {
  const n0 = 1.0;
  const r = (n0 - nSub) / (n0 + nSub);
  return r * r;
}

function findMinR(layers, nSub, λStart, λEnd, step) {
  λStart = λStart || 380;
  λEnd = λEnd || 780;
  step = step || 1;
  let bestLambda = λStart, bestR = Infinity;
  for (let λ = λStart; λ <= λEnd; λ += step) {
    const { R } = tmmReflectance(λ, layers, nSub);
    if (R < bestR) { bestR = R; bestLambda = λ; }
  }
  return { lambda: bestLambda, R: bestR };
}

// ============ Layer State Management ============
let layers = [
  { n: 1.38, d: 100 },
];
let layerCounter = 1;

function getLayerInputs() {
  const result = [];
  document.querySelectorAll('.layer-card').forEach(card => {
    const nSlider = card.querySelector('.layer-n-slider');
    const dSlider = card.querySelector('.layer-d-slider');
    result.push({
      n: parseFloat(nSlider.value),
      d: parseInt(dSlider.value),
    });
  });
  return result;
}

function buildLayerCard(idx, n, d) {
  const div = document.createElement('div');
  div.className = 'layer-card';
  div.innerHTML = `
    <div class="layer-num">
      <span>📐 第 ${idx + 1} 层 (L${idx + 1})</span>
      ${layers.length > 1 ? `<button class="btn-del" data-idx="${idx}">✕ 删除</button>` : ''}
    </div>
    <div class="param-row">
      <label>n</label>
      <input type="range" class="layer-n-slider" data-idx="${idx}" min="1.2" max="4.0" step="0.01" value="${n}">
      <span class="val layer-n-val" data-idx="${idx}" data-kind="n" data-min="1.2" data-max="4.0" data-step="0.01" data-decimals="2">${n.toFixed(2)}</span>
    </div>
    <div class="param-row" style="margin-top:6px">
      <label>d</label>
      <input type="range" class="layer-d-slider" data-idx="${idx}" min="5" max="1500" step="1" value="${d}">
      <span class="val layer-d-val" data-idx="${idx}" data-kind="d" data-min="5" data-max="1500" data-step="1" data-decimals="0" data-unit=" nm">${d} nm</span>
    </div>
  `;
  return div;
}

// Click-to-edit helper for val spans
function bindSpanClick(span) {
  span.addEventListener('click', function(e) {
    e.stopPropagation();
    const idx = parseInt(this.dataset.idx);
    const kind = this.dataset.kind;
    const min = parseFloat(this.dataset.min);
    const max = parseFloat(this.dataset.max);
    const step = parseFloat(this.dataset.step);
    const decimals = parseInt(this.dataset.decimals);
    const unit = this.dataset.unit || '';
    const currentVal = kind === 'n' ? layers[idx].n : layers[idx].d;

    const input = document.createElement('input');
    input.type = 'number';
    input.min = min;
    input.max = max;
    input.step = step;
    input.value = currentVal;
    Object.assign(input.style, {
      width: '62px', height: '22px', padding: '1px 4px',
      border: '1px solid #4fc3f7', borderRadius: '4px',
      background: '#0a0a0f', color: '#4fc3f7',
      fontSize: '10px', fontWeight: '600', textAlign: 'right',
      outline: 'none', fontFamily: 'inherit'
    });

    this.replaceWith(input);
    input.focus();
    input.select();

    const commit = () => {
      let v = parseFloat(input.value);
      if (isNaN(v)) v = currentVal;
      v = Math.min(max, Math.max(min, v));
      if (kind === 'd') v = Math.round(v);

      const formatted = kind === 'n' ? v.toFixed(decimals) : v + unit;
      const span2 = document.createElement('span');
      span2.className = 'val ' + (kind === 'n' ? 'layer-n-val' : 'layer-d-val');
      Object.assign(span2.dataset, { idx, kind, min, max, step, decimals });
      if (unit) span2.dataset.unit = unit;
      span2.textContent = formatted;
      span2.style.cursor = 'pointer';
      span2.title = '点击输入精确数值';
      bindSpanClick(span2);

      input.replaceWith(span2);

      if (kind === 'n') layers[idx].n = v;
      else layers[idx].d = v;

      const card = span2.closest('.layer-card');
      const slider = card.querySelector(kind === 'n' ? '.layer-n-slider' : '.layer-d-slider');
      slider.value = v;

      updateAll();
    };

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
      if (ev.key === 'Escape') { input.value = currentVal; commit(); }
    });
  });
}

function rebuildLayerUI() {
  const container = document.getElementById('layerList');
  container.innerHTML = '';
  layers.forEach((l, i) => {
    container.appendChild(buildLayerCard(i, l.n, l.d));
  });

  // Bind slider events
  container.querySelectorAll('.layer-n-slider').forEach(s => {
    s.addEventListener('input', () => {
      const i = parseInt(s.dataset.idx);
      layers[i].n = parseFloat(s.value);
      const card = s.closest('.layer-card');
      card.querySelector('.layer-n-val').textContent = layers[i].n.toFixed(2);
      updateAll();
    });
  });
  container.querySelectorAll('.layer-d-slider').forEach(s => {
    s.addEventListener('input', () => {
      const i = parseInt(s.dataset.idx);
      layers[i].d = parseInt(s.value);
      const card = s.closest('.layer-card');
      card.querySelector('.layer-d-val').textContent = layers[i].d + ' nm';
      updateAll();
    });
  });

  // Bind click-to-edit on val spans
  container.querySelectorAll('.layer-n-val, .layer-d-val').forEach(span => {
    span.style.cursor = 'pointer';
    span.title = '点击输入精确数值';
    bindSpanClick(span);
  });
  container.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      layers.splice(idx, 1);
      rebuildLayerUI();
      updateAll();
    });
  });

  // Update thickness scan layer selector
  updateScanLayerSelect();
}

document.getElementById('btnAddLayer').addEventListener('click', () => {
  layers.push({ n: 2.0, d: 70 });
  rebuildLayerUI();
  updateAll();
});

function updateScanLayerSelect() {
  const sel = document.getElementById('scanLayerSelect');
  sel.innerHTML = '';
  layers.forEach((l, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `第 ${i + 1} 层 (n=${l.n.toFixed(2)}, d=${l.d}nm)`;
    sel.appendChild(opt);
  });
}

// ============ Chart Rendering ============
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let W, H, padLeft, padRight, padTop, padBottom;
let currentMode = 'spectrum';

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = rect.width - 48;
  const h = Math.max(rect.height - 155, 250);
  if (w <= 0 || h <= 0) return; // skip if layout not ready
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  W = canvas.width; H = canvas.height;
  padLeft = 64 * dpr; padRight = 30 * dpr;
  padTop = 30 * dpr; padBottom = 48 * dpr;
  render();
}

function xForLambda(lambda) {
  return padLeft + ((lambda - 380) / 400) * (W - padLeft - padRight);
}
function xForThickness(d) {
  const dMin = 5, dMax = 1500;
  return padLeft + ((d - dMin) / (dMax - dMin)) * (W - padLeft - padRight);
}
function yForR(R) {
  const Rmax = 0.40;
  return padTop + (1 - R / Rmax) * (H - padTop - padBottom);
}

// ============ Wavelength to RGB ============
function wavelengthToColor(wavelength) {
  let r, g, b;
  if (wavelength >= 380 && wavelength < 440) {
    r = -(wavelength - 440) / (440 - 380); g = 0; b = 1;
  } else if (wavelength >= 440 && wavelength < 490) {
    r = 0; g = (wavelength - 440) / (490 - 440); b = 1;
  } else if (wavelength >= 490 && wavelength < 510) {
    r = 0; g = 1; b = -(wavelength - 510) / (510 - 490);
  } else if (wavelength >= 510 && wavelength < 580) {
    r = (wavelength - 510) / (580 - 510); g = 1; b = 0;
  } else if (wavelength >= 580 && wavelength < 645) {
    r = 1; g = -(wavelength - 645) / (645 - 580); b = 0;
  } else if (wavelength >= 645 && wavelength <= 780) {
    r = 1; g = 0; b = 0;
  } else { return '#000'; }
  let factor;
  if (wavelength >= 380 && wavelength < 420) {
    factor = 0.3 + 0.7 * (wavelength - 380) / (420 - 380);
  } else if (wavelength >= 645 && wavelength <= 780) {
    factor = 0.3 + 0.7 * (780 - wavelength) / (780 - 645);
  } else { factor = 1; }
  const toHex = (v) => {
    const val = Math.round(Math.max(0, Math.min(1, v * factor)) * 255);
    return val.toString(16).padStart(2, '0');
  };
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

// ============ Spectrum Mode Render ============
function renderSpectrum(dpr, layers, nSub) {
  const Rmax = 0.40;

  // Spectrum bar
  const spectrumGrad = ctx.createLinearGradient(padLeft, 0, W - padRight, 0);
  for (let λ = 380; λ <= 780; λ += 5) {
    spectrumGrad.addColorStop((λ-380)/400, wavelengthToColor(λ));
  }
  ctx.fillStyle = spectrumGrad;
  ctx.fillRect(padLeft, padTop - 14*dpr, W - padLeft - padRight, 10*dpr);

  // Horizontal grid
  ctx.strokeStyle = '#1a1a24'; ctx.lineWidth = 1; ctx.font = `${10*dpr}px Inter, sans-serif`;
  for (let R = 0; R <= Rmax + 0.01; R += 0.05) {
    const y = yForR(R);
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(W - padRight, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillStyle = '#555';
    ctx.fillText((R*100).toFixed(0) + '%', padLeft - 8*dpr, y + 3*dpr);
  }

  // Zero line
  ctx.beginPath(); ctx.moveTo(padLeft, yForR(0)); ctx.lineTo(W - padRight, yForR(0));
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 0.5; ctx.stroke();

  // Vertical grid
  const bands = [380, 450, 495, 570, 590, 620, 750];
  for (const λ of bands) {
    const x = xForLambda(λ);
    ctx.beginPath(); ctx.moveTo(x, padTop); ctx.lineTo(x, H - padBottom);
    ctx.strokeStyle = '#151520'; ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#555';
    ctx.fillText(λ, x, H - padBottom + 16*dpr);
  }

  // Axes
  ctx.fillStyle = '#888'; ctx.textAlign = 'center';
  ctx.fillText('波长 (nm)', W / 2, H - 4*dpr);
  ctx.save(); ctx.translate(14*dpr, H / 2); ctx.rotate(-Math.PI/2);
  ctx.fillText('反射率 R', 0, 0); ctx.restore();

  // Bare substrate dashed curve
  ctx.beginPath(); ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
  ctx.setLineDash([4*dpr, 4*dpr]);
  let first = true;
  for (let λ = 380; λ <= 780; λ += 1) {
    const x = xForLambda(λ), y = yForR(reflectanceBare(λ, nSub));
    if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
  }
  ctx.stroke(); ctx.setLineDash([]);

  // Multilayer curve
  const curveData = [];
  for (let λ = 380; λ <= 780; λ += 1) {
    const { R } = tmmReflectance(λ, layers, nSub);
    curveData.push({ λ, R, x: xForLambda(λ), y: yForR(Math.min(R, Rmax)) });
  }
  // Fill
  ctx.beginPath();
  for (let i = 0; i < curveData.length; i++) {
    if (i === 0) ctx.moveTo(curveData[i].x, curveData[i].y);
    else ctx.lineTo(curveData[i].x, curveData[i].y);
  }
  ctx.lineTo(curveData[curveData.length-1].x, H - padBottom);
  ctx.lineTo(curveData[0].x, H - padBottom); ctx.closePath();
  const grad = ctx.createLinearGradient(0, padTop, 0, H - padBottom);
  grad.addColorStop(0, 'rgba(79,195,247,0.25)'); grad.addColorStop(1, 'rgba(79,195,247,0.02)');
  ctx.fillStyle = grad; ctx.fill();
  // Stroke
  ctx.beginPath(); ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
  for (let i = 0; i < curveData.length; i++) {
    if (i === 0) ctx.moveTo(curveData[i].x, curveData[i].y);
    else ctx.lineTo(curveData[i].x, curveData[i].y);
  }
  ctx.stroke();

  // Minimum reflectance marker
  const minR = findMinR(layers, nSub);
  if (minR.R < Infinity && minR.R < Rmax) {
    const minX = xForLambda(minR.lambda);
    const minY = yForR(Math.min(minR.R, Rmax));
    ctx.beginPath();
    ctx.moveTo(minX, minY - 8*dpr); ctx.lineTo(minX + 6*dpr, minY);
    ctx.lineTo(minX, minY + 8*dpr); ctx.lineTo(minX - 6*dpr, minY);
    ctx.closePath();
    ctx.fillStyle = '#ff8a65'; ctx.fill();
    ctx.strokeStyle = '#ff8a65'; ctx.lineWidth = 1.5; ctx.stroke();
    const labelX = minX + 10*dpr; const labelY = minY - 12*dpr;
    ctx.fillStyle = '#ff8a65'; ctx.font = `${11*dpr}px Inter, sans-serif`; ctx.textAlign = 'left';
    ctx.fillText(`λ=${minR.lambda}nm, R=${(minR.R*100).toFixed(2)}%`, labelX, labelY);
  }
}

// ============ Thickness Scan Mode ============
function renderThicknessScan(dpr, layers, nSub, scanLayerIdx) {
  const targetLambda = 550;
  const Rmax = 0.40;
  const dMin = 5, dMax = 1500;

  // Horizontal grid
  ctx.strokeStyle = '#1a1a24'; ctx.lineWidth = 1; ctx.font = `${10*dpr}px Inter, sans-serif`;
  for (let R = 0; R <= Rmax + 0.01; R += 0.05) {
    const y = yForR(R);
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(W - padRight, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillStyle = '#555';
    ctx.fillText((R*100).toFixed(0) + '%', padLeft - 8*dpr, y + 3*dpr);
  }

  // Vertical grid
  for (let dTick = 100; dTick <= dMax; dTick += 100) {
    const x = xForThickness(dTick);
    ctx.beginPath(); ctx.moveTo(x, padTop); ctx.lineTo(x, H - padBottom);
    ctx.strokeStyle = '#151520'; ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#555';
    ctx.fillText(dTick, x, H - padBottom + 16*dpr);
  }

  // Axes
  ctx.fillStyle = '#888'; ctx.textAlign = 'center';
  ctx.fillText('薄膜厚度 d (nm)', W / 2, H - 4*dpr);
  ctx.save(); ctx.translate(14*dpr, H / 2); ctx.rotate(-Math.PI/2);
  ctx.fillText('反射率 @550nm R', 0, 0); ctx.restore();

  // R(d) curve — vary the selected layer, keep others fixed
  const curveData = [];
  for (let _d = dMin; _d <= dMax; _d += 1) {
    const testLayers = layers.map((l, i) => ({
      n: l.n,
      d: i === scanLayerIdx ? _d : l.d,
    }));
    const { R } = tmmReflectance(targetLambda, testLayers, nSub);
    curveData.push({ d: _d, R, x: xForThickness(_d), y: yForR(Math.min(R, Rmax)) });
  }

  // Fill
  ctx.beginPath();
  for (let i = 0; i < curveData.length; i++) {
    if (i === 0) ctx.moveTo(curveData[i].x, curveData[i].y);
    else ctx.lineTo(curveData[i].x, curveData[i].y);
  }
  ctx.lineTo(curveData[curveData.length-1].x, H - padBottom);
  ctx.lineTo(curveData[0].x, H - padBottom); ctx.closePath();
  const grad = ctx.createLinearGradient(0, padTop, 0, H - padBottom);
  grad.addColorStop(0, 'rgba(79,195,247,0.25)'); grad.addColorStop(1, 'rgba(79,195,247,0.02)');
  ctx.fillStyle = grad; ctx.fill();

  // Stroke
  ctx.beginPath(); ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
  for (let i = 0; i < curveData.length; i++) {
    if (i === 0) ctx.moveTo(curveData[i].x, curveData[i].y);
    else ctx.lineTo(curveData[i].x, curveData[i].y);
  }
  ctx.stroke();

  // Bare substrate reference line
  const bareR = reflectanceBare(targetLambda, nSub);
  const yBare = yForR(bareR);
  ctx.beginPath(); ctx.moveTo(padLeft, yBare); ctx.lineTo(W - padRight, yBare);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.setLineDash([4*dpr, 4*dpr]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#555'; ctx.textAlign = 'left'; ctx.font = `${10*dpr}px Inter, sans-serif`;
  ctx.fillText(`裸基底 R=${(bareR*100).toFixed(2)}%`, W - padRight - 130*dpr, yBare - 6*dpr);

  // Current thickness marker
  const curD = layers[scanLayerIdx].d;
  const xCur = xForThickness(curD);
  const { R: Rcur } = tmmReflectance(targetLambda, layers, nSub);
  const yCur = yForR(Math.min(Rcur, Rmax));
  ctx.beginPath(); ctx.moveTo(xCur, padTop); ctx.lineTo(xCur, H - padBottom);
  ctx.strokeStyle = 'rgba(255,138,101,0.4)'; ctx.lineWidth = 1; ctx.setLineDash([3*dpr, 3*dpr]); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(xCur, yCur, 5*dpr, 0, Math.PI*2); ctx.fillStyle = '#ff8a65'; ctx.fill();
  ctx.font = `${11*dpr}px Inter, sans-serif`; ctx.fillStyle = '#ff8a65'; ctx.textAlign = 'left';
  ctx.fillText(`d=${curD}nm, R=${(Rcur*100).toFixed(2)}%`, xCur + 8*dpr, yCur + 4*dpr);

  // Period annotation
  const nScan = layers[scanLayerIdx].n;
  const period = targetLambda / (2 * nScan);
  ctx.fillStyle = '#555'; ctx.textAlign = 'left'; ctx.font = `${10*dpr}px Inter, sans-serif`;
  ctx.fillText(`周期 = λ/(2n) = ${period.toFixed(1)} nm`, padLeft + 10*dpr, padTop + 16*dpr);
}

// ============ Main render ============
function render() {
  const dpr = window.devicePixelRatio || 1;
  const nSub = parseFloat(document.getElementById('nSub').value);

  ctx.clearRect(0, 0, W, H);

  if (currentMode === 'spectrum') {
    renderSpectrum(dpr, layers, nSub);
  } else {
    const scanIdx = parseInt(document.getElementById('scanLayerSelect').value) || 0;
    renderThicknessScan(dpr, layers, nSub, scanIdx);
  }
}

// ============ UI Update ============
function updateAll() {
  const nSub = parseFloat(document.getElementById('nSub').value);
  document.getElementById('nSubVal').textContent = nSub.toFixed(2);

  const bareR = reflectanceBare(550, nSub);
  document.getElementById('bareR').textContent = (bareR * 100).toFixed(2) + '%';

  // Min R info
  const minR = findMinR(layers, nSub);
  if (minR.R < Infinity) {
    document.getElementById('infoMinR').style.display = '';
    document.getElementById('minRLambda').textContent = minR.lambda + ' nm';
    document.getElementById('minRVal').textContent = (minR.R * 100).toFixed(2) + '%';
  } else {
    document.getElementById('infoMinR').style.display = 'none';
  }

  // Explain area for single-layer
  const explainArea = document.getElementById('explainArea');
  if (layers.length === 1) {
    const n1 = layers[0].n;
    const idealN1 = Math.sqrt(1.0 * nSub);
    const diffPct = Math.abs((n1 - idealN1) / idealN1 * 100);
    let title, body;
    if (nSub < 1.01) {
      // Air backing — symmetric medium, ideal n₁ also = 1.0, but physical films always n > 1
      title = '💡 对称膜系：肥皂泡干涉';
      body = `空气-水膜-空气结构，两侧介质相同 (n₀=n₂=1.0)。<br>
        膜的折射率 n₁=${n1.toFixed(2)} 高于空气，产生界面反射。<br>
        <span style="color:#ffcc80;font-weight:500;">R 随波长周期性振荡</span>，膜厚为 λ/4 整数倍时 R 最小。`;
    } else if (diffPct < 5) {
      title = '💡 为什么反射率降不到零？';
      body = `完美增透需要 <span style="color:#ffcc80;font-weight:500;">n₁ = √(n₀ × n₂)</span>。<br>
        当前 n₁=<b>${n1.toFixed(2)}</b>，理想值 = √(1.0×${nSub.toFixed(2)}) = <b>${idealN1.toFixed(2)}</b>。<br>
        <span style="color:#ffcc80;font-weight:500;">✓ 折射率匹配很好！</span> 反射率接近零。`;
    } else {
      title = '💡 为什么反射率降不到零？';
      body = `完美增透需要 <span style="color:#ffcc80;font-weight:500;">n₁ = √(n₀ × n₂)</span>。<br>
        当前 n₁=<b>${n1.toFixed(2)}</b>，理想值 = √(1.0×${nSub.toFixed(2)}) = <b>${idealN1.toFixed(2)}</b>。<br>
        偏差 ${diffPct.toFixed(0)}%，真实材料无法完美匹配。`;
    }
    explainArea.innerHTML = `<div class="explain-box" style="background:rgba(255,138,101,0.06);border:1px solid rgba(255,138,101,0.15);border-radius:10px;padding:14px 16px;margin-top:12px;">
      <div class="explain-title" style="font-size:11px;font-weight:600;color:#ff8a65;margin-bottom:6px;">${title}</div>
      <div style="font-size:11px;color:#999;line-height:1.6;">${body}
      </div>
    </div>`;
  } else {
    explainArea.innerHTML = `<div style="font-size:10px;color:#444;margin-top:10px;line-height:1.6;">
      ${layers.length} 层膜 · 传输矩阵法 (TMM)<br>
      各层参数可独立调节，实时计算总反射率
    </div>`;
  }

  render();
}

// ============ Presets ============
const presets = {

  filter5:    {

document.getElementById('presetSelect').addEventListener('change', function() {
  const key = this.value;
  const p = presets[key];
  if (!p) return;
  layers = p.layers.map(l => ({ n: l.n, d: l.d }));
  document.getElementById('nSub').value = p.nSub;
  rebuildLayerUI();
  updateAll();
});

// ============ Mode Toggle ============
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('thicknessScanLayer').style.display = mode === 'thickness' ? '' : 'none';
    if (mode === 'spectrum') {
      document.getElementById('chartTitle').textContent = '反射率 vs 波长';
      document.getElementById('chartSubtitle').textContent = '380 – 780 nm 可见光波段';
    } else {
      document.getElementById('chartTitle').textContent = '反射率 @550nm vs 膜厚';
      document.getElementById('chartSubtitle').textContent = '选择扫描目标层，看反射率随膜厚周期性变化';
    }
    render();
  });
});

// ============ Substrate input ============
document.getElementById('nSub').addEventListener('input', updateAll);
// Substrate val click-to-edit
(function() {
  const nSubVal = document.getElementById('nSubVal');
  nSubVal.addEventListener('click', function(e) {
    e.stopPropagation();
    const currentVal = parseFloat(document.getElementById('nSub').value);
    const input = document.createElement('input');
    input.type = 'number';
    input.min = 1.0; input.max = 5.0; input.step = 0.01;
    input.value = currentVal;
    Object.assign(input.style, {
      width: '62px', height: '22px', padding: '1px 4px',
      border: '1px solid #ff8a65', borderRadius: '4px',
      background: '#0a0a0f', color: '#ff8a65',
      fontSize: '10px', fontWeight: '600', textAlign: 'right',
      outline: 'none', fontFamily: 'inherit'
    });
    this.replaceWith(input);
    input.focus(); input.select();
    const commit = () => {
      let v = parseFloat(input.value);
      if (isNaN(v)) v = currentVal;
      v = Math.min(5.0, Math.max(1.0, v));
      document.getElementById('nSub').value = v;
      nSubVal.textContent = v.toFixed(2);
      input.replaceWith(nSubVal);
      updateAll();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
      if (ev.key === 'Escape') { input.value = currentVal; commit(); }
    });
  });
})();

// ============ Init ============
// Defer UI build until canvas is ready (fixes iframe/headless timing issues)
function initApp(attempt) {
  attempt = attempt || 0;
  const rect = canvas.parentElement.getBoundingClientRect();
  if ((rect.width <= 0 || rect.height <= 0) && attempt < 10) {
    setTimeout(function() { initApp(attempt + 1); }, 100);
    return;
  }
  resize();
  rebuildLayerUI();
  updateAll();
}
window.addEventListener('resize', resize);
initApp();
</script>
