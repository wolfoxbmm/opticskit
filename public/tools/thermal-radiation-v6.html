function planck(wl_m,T){if(T<=0||wl_m<=0)return 0;var x=(H*C)/(wl_m*KB*T);if(x>700)return 0;return(2*H*C*C)/(Math.pow(wl_m,5)*(Math.exp(x)-1))}

function renderTabs(){

function switchMode(m){

  var l=$('matList');if(!l)return;l.innerHTML='';
  var s=($('matSearch')?.value||'').toLowerCase();
  var filtered=M.filter(function(m){return !s||m.name.toLowerCase().includes(s)||m.id.includes(s)||m.category.includes(s)});
  if(!filtered.length){l.innerHTML='<div class="empty" style="padding:16px">未找到匹配材料</div>';return}
  var groups={};
  filtered.forEach(function(m){if(!groups[m.category])groups[m.category]=[];groups[m.category].push(m)});
  var keys=Object.keys(groups).sort();
  var total=filtered.length;
  keys.forEach(function(cat){
    var hdr=document.createElement('div');hdr.className='mat-cat';hdr.textContent=cat+' ('+groups[cat].length+')';hdr.onclick=function(){var c=this.classList;c.toggle('collapsed');var hidden=c.contains('collapsed');var n=this.nextElementSibling;while(n&&!n.classList.contains('mat-cat')){n.style.display=hidden?'none':'';n=n.nextElementSibling}};l.appendChild(hdr);
    groups[cat].forEach(function(m){
      var it=document.createElement('div');it.className='mat-item'+(sel.includes(m.id)?' sel':'');
      var ci=m.conf==='high'?'<span class="cf cf-hi" title="High confidence">&#9679;</span>':'<span class="cf cf-md" title="Medium confidence">&#9675;</span>';
      it.innerHTML='<span>'+m.name+ci+'</span><span class="eps">e='+m.emissivity.total+'</span>';
      it.onclick=function(){
        if(mode==='single'||mode==='scan'){sel=[m.id]}
        else{var idx=sel.indexOf(m.id);if(idx>=0)sel.splice(idx,1);else if(sel.length<10)sel.push(m.id);if(!sel.length)sel=['blackbody']}
        renderMatList();if(mode!=='scan')calculate()
      };
      l.appendChild(it);
    });
  });
  if(mode==='compare'){
    var info=document.createElement('div');info.className='mat-info';
    info.innerHTML='已选 '+sel.length+'/10 &middot; <span style="color:#9CA3AF">点击图例开关曲线</span>';
    l.appendChild(info);
  }
}

function calculate(){
  try{
    var T=parseFloat($('tempInput')?.value)||500;
    var wlMin=parseFloat($('wlMin')?.value)||0.5;
    var wlMax=parseFloat($('wlMax')?.value)||25;
    var mats=sel.map(function(id){return M.find(function(m){return m.id===id})}).filter(Boolean);
    if(!mats.length){$('results').innerHTML='';return}
    var N=400,wl=[];
    for(var i=0;i<=N;i++)wl.push(wlMin+(wlMax-wlMin)*i/N);
    var series=mats.map(function(mat){
      var data=wl.map(function(w){return(Math.PI*planck(w*1e-6,T)*emis(mat,w))/1e6});
      var pw=WIEN_CONST/T,pv=(Math.PI*planck(pw*1e-6,T)*emis(mat,pw))/1e6;
      var tr=SB*Math.pow(T,4)*mat.emissivity.total;
      var br=simp(function(w){return Math.PI*planck(w*1e-6,T)*emis(mat,w)/1e6},wlMin,wlMax,200);
      return{name:mat.name,conf:mat.conf||'medium',data:data,peakWl:pw,peakVal:pv,totalRad:tr,bandRad:br,bandPct:tr>0?br/tr*100:0}
    });
    renderChart(wl,series);
    renderResults(series,T,wlMin,wlMax);
  }catch(e){toast('错误: '+e.message)}
}

function renderChart(wl,series){
  var dom=$('chart');var ph=$('chartPlaceholder');if(ph)ph.style.display='none';if(!chart)chart=echarts.init(dom);
  var colors=['#2563EB','#DC2626','#059669','#7C3AED','#D97706','#EC4899','#0891B2','#78716C','#84CC16','#F59E0B'];
  var selLegend={};series.forEach(function(s,i){selLegend[s.name]=i<4});
  
  var sOpts=series.map(function(s,i){return{name:s.name,type:'line',data:wl.map(function(v,j){return[v,s.data[j]]}),smooth:true,symbol:'none',lineStyle:{width:2},color:colors[i%colors.length]}});
  
  if(series.length===1){
    sOpts[0].markLine={silent:true,symbol:'none',lineStyle:{color:'#DC2626',type:'dashed',width:1.5},label:{formatter:'峰值 '+series[0].peakWl.toFixed(2)+' μm',fontSize:10,color:'#DC2626'},data:[{xAxis:series[0].peakWl}]};
  }

  chart.setOption({
    tooltip:{trigger:'axis',formatter:function(p){var s='<b>'+p[0].value[0].toFixed(1)+' μm</b><br/>';p.forEach(function(x){s+=x.marker+' '+x.seriesName+': '+x.value[1].toExponential(2)+' W/(m2·μm)<br/>'});return s}},
    legend:{top:0,textStyle:{fontSize:10,color:'#6B7280'},selected:selLegend},
    grid:{left:90,right:30,top:series.length>1?35:25,bottom:65},
    xAxis:{type:'value',name:'波长 (μm)',nameLocation:'center',nameGap:30,nameTextStyle:{fontSize:11,color:'#6B7280'},axisLabel:{fontSize:9,color:'#9CA3AF'},axisLine:{lineStyle:{color:'#E5E7EB'}},axisTick:{show:false},min:function(d){return d.min},max:function(d){return d.max}},
    yAxis:{type:'value',axisLabel:{formatter:function(v){return v.toExponential(1)},fontSize:9,color:'#9CA3AF'},splitLine:{lineStyle:{color:'#F3F4F6'}}},
    series:sOpts,
    graphic:{type:'group',left:8,top:'center',children:[{type:'text',rotation:-1.5708,style:{text:'光谱辐出度 (W/(m²·μm))',font:'bold 12px -apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif',fill:'#374151'}}]}
  },true);
}

function renderResults(series,T,wlMin,wlMax){
  var cards=series.map(function(s){
    var cl=s.conf==='high'?'高置信度':'中置信度',cc=s.conf==='high'?'rt-hi':'rt-md';
    return'<div class="r-card" style="position:relative"><span class="rt '+cc+'">'+cl+'</span><div class="rl" style="padding-right:36px">'+s.name+'</div><div class="rv">Peak '+s.peakWl.toFixed(2)+' um</div><div class="ru">总辐射 '+fm(s.totalRad,0)+' W/m2</div><div class="rd">波段('+wlMin+'-'+wlMax+'μm): '+fm(s.bandRad,0)+' W/m2 ('+s.bandPct.toFixed(1)+'%)</div></div>'
  });
  $('results').innerHTML=cards.join('');
}

function runScan(){
  try{
    var tS=parseFloat($('tStart')?.value)||300,tE=parseFloat($('tEnd')?.value)||1200,tStep=parseFloat($('tStep')?.value)||50;
    var wlMin=parseFloat($('wlMinS')?.value)||3,wlMax=parseFloat($('wlMaxS')?.value)||5;
    var mat=M.find(function(m){return m.id===sel[0]})||M[0];
    var temps=[],peak=[],tot=[],band=[],bpct=[];
    for(var T=tS;T<=tE;T+=tStep){
      temps.push(T);
      peak.push([T,WIEN_CONST/T]);
      var tr=SB*Math.pow(T,4)*mat.emissivity.total;
      tot.push([T,tr]);
      var br=simp(function(w){return Math.PI*planck(w*1e-6,T)*emis(mat,w)/1e6},wlMin,wlMax,200);
      band.push([T,br]);
      bpct.push([T,tr>0?br/tr*100:0]);
    }
    if(!chart)chart=echarts.init($('chart'));
    chart.setOption({
      title:{text:mat.name+' Temperature Scan '+tS+'-'+tE+'K, Band '+wlMin+'-'+wlMax+'um',left:'center',textStyle:{fontSize:12,color:'#111827'}},
      tooltip:{trigger:'axis',formatter:function(p){var s='';p.forEach(function(x){s+=x.marker+' '+x.seriesName+': '+fm(x.value[1],2)+'<br/>'});return s}},
      legend:{top:28,textStyle:{fontSize:10}},
      grid:{left:100,right:30,top:70,bottom:65},
      xAxis:{type:'value',name:'温度 (K)',axisLabel:{fontSize:9},nameTextStyle:{fontSize:10},nameGap:30},
      yAxis:{type:'value',axisLabel:{fontSize:9,formatter:function(v){return fm(v,2)}},nameTextStyle:{fontSize:10},splitLine:{lineStyle:{color:'#F3F4F6'}}},
      series:[
        {name:'峰值波长 (um)',type:'line',data:peak,smooth:true,color:'#2563EB',symbol:'none',lineStyle:{width:2}},
        {name:'总辐射 (W/m2)',type:'line',data:tot,smooth:true,color:'#DC2626',symbol:'none',lineStyle:{width:2}},
        {name:'波段 '+wlMin+'-'+wlMax+'μm (W/m2)',type:'line',data:band,smooth:true,color:'#059669',symbol:'none',lineStyle:{width:2}}
      ]
    },true);
    
    var tbl='<table><thead><tr><th>T (K)</th><th>Peak (μm)</th><th>总辐射 (W/m²)</th><th>波段辐射 (W/m²)</th><th>比例</th></tr></thead><tbody>';
    temps.forEach(function(T,i){
      tbl+='<tr><td>'+T+'</td><td>'+peak[i][1].toFixed(2)+'</td><td>'+fm(tot[i][1],0)+'</td><td>'+fm(band[i][1],0)+'</td><td>'+bpct[i][1].toFixed(1)+'%</td></tr>';
    });
    tbl+='</tbody></table>';
    $('scanTable').innerHTML=tbl;
    $('scanTable').style.display='block';
    scanCache={temps:temps,peak:peak,tot:tot,band:band,bpct:bpct,wlMin:wlMin,wlMax:wlMax,name:mat.name};
  }catch(e){toast('扫描错误: '+e.message)}
}

function restoreScanResults(){
  if(!scanCache)return;
  var sc=scanCache;
  // 重建图表
  if(!chart)chart=echarts.init($('chart'));
  chart.setOption({
    title:{text:sc.name+' Temperature Scan, Band '+sc.wlMin+'-'+sc.wlMax+'um',left:'center',textStyle:{fontSize:12,color:'#111827'}},
    tooltip:{trigger:'axis',formatter:function(p){var s='';p.forEach(function(x){s+=x.marker+' '+x.seriesName+': '+fm(x.value[1],2)+'<br/>'});return s}},
    legend:{top:28,textStyle:{fontSize:10}},
    grid:{left:100,right:30,top:70,bottom:65},
    xAxis:{type:'value',name:'温度 (K)',axisLabel:{fontSize:9},nameTextStyle:{fontSize:10},nameGap:30},
    yAxis:{type:'value',axisLabel:{fontSize:9,formatter:function(v){return fm(v,2)}},nameTextStyle:{fontSize:10},splitLine:{lineStyle:{color:'#F3F4F6'}}},
    series:[
      {name:'峰值波长 (um)',type:'line',data:sc.peak,smooth:true,color:'#2563EB',symbol:'none',lineStyle:{width:2}},
      {name:'总辐射 (W/m2)',type:'line',data:sc.tot,smooth:true,color:'#DC2626',symbol:'none',lineStyle:{width:2}},
      {name:'波段 '+sc.wlMin+'-'+sc.wlMax+'μm (W/m2)',type:'line',data:sc.band,smooth:true,color:'#059669',symbol:'none',lineStyle:{width:2}}
    ]
  },true);
  // 重建表格
  var tbl='<table><thead><tr><th>T (K)</th><th>Peak (μm)</th><th>总辐射 (W/m²)</th><th>波段辐射 (W/m²)</th><th>比例</th></tr></thead><tbody>';
  sc.temps.forEach(function(T,i){
    tbl+='<tr><td>'+T+'</td><td>'+sc.peak[i][1].toFixed(2)+'</td><td>'+fm(sc.tot[i][1],0)+'</td><td>'+fm(sc.band[i][1],0)+'</td><td>'+sc.bpct[i][1].toFixed(1)+'%</td></tr>';
  });
  tbl+='</tbody></table>';
  $('scanTable').innerHTML=tbl;
  $('scanTable').style.display='block';
}

function doExport(fmt){
  try{
    toast('Exporting '+fmt.toUpperCase()+'...');
    if(mode==='scan'&&scanCache){
      if(fmt==='csv'){
        var d=scanCache,csv='\uFEFFT(K),Peak(μm),Total(W/m2),Band'+d.wlMin+'-'+d.wlMax+'μm(W/m2),Ratio(%)\n';
        d.temps.forEach(function(T,i){csv+=T+','+d.peak[i][1]+','+d.tot[i][1]+','+d.band[i][1]+','+d.bpct[i][1]+'\n'});
        download('scan.csv',csv,'text/csv');
      }else if(fmt==='json'){
        download('scan.json',JSON.stringify(scanCache,null,2),'application/json');
      }else if(fmt==='png'&&chart){
        var a=document.createElement('a');a.href=chart.getDataURL({type:'png',pixelRatio:2,backgroundColor:'#fff'});a.download='scan.png';a.click();
      }
      return;
    }
    if(!chart)return;
    var o=chart.getOption();
    if(fmt==='csv'){
      var x=o.xAxis[0].data,csv='\uFEFFWavelength(μm),'+o.series.map(function(s){return s.name}).join(',')+'\n';
      o.series[0].data.forEach(function(_,i){csv+=x[i]+','+o.series.map(function(s){return s.data[i]}).join(',')+'\n'});
      download('data.csv',csv,'text/csv');
    }else if(fmt==='json'){
      download('data.json',JSON.stringify({wl_um:o.xAxis[0].data,series:o.series.map(function(s){return{name:s.name,data:s.data}})},null,2),'application/json');
    }else if(fmt==='png'){
      var a=document.createElement('a');a.href=chart.getDataURL({type:'png',pixelRatio:2,backgroundColor:'#fff'});a.download='chart.png';a.click();
    }
  }catch(e){toast('导出错误: '+e.message)}
}

function download(fn,ct,mime){
  var b=new Blob([ct],{type:mime||'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click();
  URL.revokeObjectURL(a.href);
}

window.addEventListener('resize',function(){chart&&chart.resize()});

$('presets').innerHTML=['<span class="preset" title="全波段 0.1-100um" onclick="set波段(0.1,100)">Full 0.1-100um</span>','<span class="preset" title="常用红外波段 0.5-25um" onclick="set波段(0.5,25)">0.5-25um</span>','<span class="preset" title="中波红外 3-5um" onclick="set波段(3,5)">MWIR 3-5um</span>','<span class="preset" title="长波红外 8-14um" onclick="set波段(8,14)">LWIR 8-14um</span>','<span class="preset" title="短波红外 1-3um" onclick="set波段(1,3)">SWIR 1-3um</span>'].join('');

init();
