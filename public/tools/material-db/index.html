<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光学材料折射率数据库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e0}
.container{display:flex;gap:16px;padding:16px;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#555}

.panel{background:#13131a;border-radius:12px;border:1px solid #1e1e2a;display:flex;flex-direction:column;overflow:hidden}

/* Left: material list */
.panel-left{width:300px;flex-shrink:0}
.pl-header{padding:16px 16px 12px;border-bottom:1px solid #1e1e2a;flex-shrink:0}
.pl-header h2{font-size:15px;font-weight:600;color:#fff}
.pl-header .sub{font-size:11px;color:#777;margin-top:2px}
.search-wrap{position:relative;margin-top:10px}
.search-wrap input{width:100%;padding:8px 12px 8px 28px;border:1px solid #1e1e2a;border-radius:7px;background:#0a0a0f;color:#e0e0e0;font-size:12px;font-family:inherit;outline:none}
.search-wrap input:focus{border-color:#4fc3f7}
.search-wrap input::placeholder{color:#444}
.search-wrap .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#555;font-size:12px}
.cat-tags{display:flex;gap:3px;flex-wrap:wrap;padding:10px 16px 6px;flex-shrink:0}
.cat-tag{padding:4px 10px;border-radius:5px;border:1px solid #1e1e2a;background:transparent;color:#888;font-size:11px;cursor:pointer;transition:all .2s}
.cat-tag:hover,.cat-tag.active{background:rgba(79,195,247,.1);border-color:#4fc3f7;color:#4fc3f7}
.mat-list{flex:1;overflow-y:auto;padding:4px 8px}
.mat-item{padding:9px 12px;border-radius:7px;cursor:pointer;transition:all .12s;margin-bottom:1px}
.mat-item:hover{background:#1a1a24}
.mat-item.active{background:rgba(79,195,247,.08);border:1px solid rgba(79,195,247,.15)}
.mat-item .mt{font-size:13px;font-weight:500;color:#eee}
.mat-item .mt .cn{color:#4fc3f7;margin-left:5px;font-size:11px}
.mat-item .mm{font-size:10px;color:#777;margin-top:3px;display:flex;gap:10px}
.pl-footer{padding:10px 16px;border-top:1px solid #1e1e2a;font-size:9px;color:#444;text-align:center;flex-shrink:0;line-height:1.5}
.no-r{text-align:center;padding:24px;color:#555;font-size:11px}

/* Center: detail */
.panel-center{flex:1;min-width:280px}
.pc-placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#333;font-size:13px}
.pc-content{display:none;flex-direction:column;height:100%;overflow:hidden}
.pc-content.active{display:flex}
.pc-header{padding:16px 20px 12px;border-bottom:1px solid #1e1e2a;flex-shrink:0}
.pc-header h3{font-size:16px;font-weight:600;color:#fff}
.pc-header .pc-sub{font-size:12px;color:#888;margin-top:3px}
.pc-body{flex:1;overflow-y:auto;padding:16px 20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px}
.di{display:flex;flex-direction:column;gap:3px}
.di .dl{color:#888;font-size:11px}
.di .dv{color:#ddd;word-break:break-all;font-size:13px}
.di .dv.mono{font-family:'Consolas','Monaco',monospace;font-size:12px;color:#81c784}
.coeff-box{background:#0a0a0f;border-radius:8px;padding:12px;margin-top:8px;font-family:'Consolas','Monaco',monospace;font-size:12px;color:#81c784;position:relative;grid-column:1/-1}
.coeff-box .copy-btn{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:4px;border:1px solid #1e1e2a;background:#13131a;color:#888;font-size:10px;cursor:pointer;transition:all .2s}
.coeff-box .copy-btn:hover{color:#fff;border-color:#4fc3f7}
.src-list{grid-column:1/-1;margin-top:6px}
.src-item{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:11px;color:#aaa;transition:all .12s;margin-bottom:1px;display:flex;justify-content:space-between}
.src-item:hover{background:#1a1a24;color:#ddd}
.src-item.active{background:rgba(79,195,247,.08);color:#4fc3f7}
.src-item .sm{font-size:10px;color:#777}
.aniso-badge{display:inline-block;padding:1px 5px;border-radius:3px;background:rgba(255,183,77,.15);color:#ffb74d;font-size:9px;margin-left:5px}

/* Data table in detail panel */
.data-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;grid-column:1/-1}
.data-table th{text-align:left;color:#777;font-weight:500;padding:4px 8px;border-bottom:1px solid #1e1e2a;font-size:10px}
.data-table td{padding:3px 8px;color:#ccc;font-family:'Consolas','Monaco',monospace;border-bottom:1px solid #0f0f15}
.data-table tr:hover td{background:#0f0f18}
.n-values{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px;background:#0a0a0f;border-radius:8px;margin-top:8px;grid-column:1/-1}
.n-values .nv-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.n-values .nv-wl{font-size:10px;color:#777}
.n-values .nv-n{font-size:16px;font-weight:600;color:#4fc3f7;font-family:'Consolas','Monaco',monospace}
.n-values .nv-k{font-size:10px;color:#ff8a65}

/* Right: chart */
.panel-right{flex:2;min-width:400px}
.pr-header{padding:16px 20px 12px;border-bottom:1px solid #1e1e2a;flex-shrink:0}
.pr-header h3{font-size:15px;font-weight:600;color:#fff}
.pr-header .pr-sub{font-size:10px;color:#555;margin-top:2px}
.pr-body{flex:1;position:relative;overflow:hidden}
.pr-body canvas{position:absolute;top:8px;left:8px;right:8px;bottom:8px;border-radius:8px;background:#0a0a0f}
.pr-placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#333;font-size:13px}
.pr-legend{display:none;gap:16px;padding:8px 20px 12px;font-size:10px;color:#666;flex-shrink:0}
.pr-legend.show{display:flex}
.pr-legend span{display:flex;align-items:center;gap:5px}
.pr-legend .dot{width:8px;height:8px;border-radius:2px}
.wl-calc{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0a0a0f;border-radius:8px;margin-top:4px;grid-column:1/-1;flex-wrap:wrap}
.wl-calc-label{font-size:11px;color:#888;white-space:nowrap}
.wl-calc-input{width:90px;padding:6px 8px;border:1px solid #1e1e2a;border-radius:6px;background:#13131a;color:#e0e0e0;font-size:13px;font-family:'Consolas','Monaco',monospace;outline:none}
.wl-calc-input:focus{border-color:#4fc3f7}
.wl-calc-result{font-size:14px;color:#4fc3f7;font-family:'Consolas','Monaco',monospace;font-weight:600}
.wl-calc-result b{color:#fff}
</style>
</head>
<body>
<div class="container">
  <!-- Left: Material List -->
  <div class="panel panel-left">
    <div class="pl-header">
      <h2>光学材料折射率数据库</h2>
      <p class="sub">RefractiveIndex.info · CC0 · <span id="matCount">-</span> 种</p>
      <div class="search-wrap">
        <span class="si">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索中英文名、化学式...">
      </div>
    </div>
    <div class="cat-tags" id="catTags"></div>
    <div class="mat-list" id="matList"></div>
    <div class="pl-footer">数据: refractiveindex.info (CC0 1.0)<br>版本: 2026-06-11 · Mikhail Polyanskiy</div>
  </div>

  <!-- Center: Material Detail -->
  <div class="panel panel-center" id="detailPanel">
    <div class="pc-placeholder" id="detailPlaceholder">← 选择材料查看详情</div>
    <div class="pc-content" id="detailContent">
      <div class="pc-header">
        <h3 id="detailTitle">-</h3>
        <p class="pc-sub" id="detailSub">-</p>
      </div>
      <div class="pc-body" id="detailBody"></div>
    </div>
  </div>

  <!-- Right: Chart -->
  <div class="panel panel-right" id="chartPanel">
    <div class="pr-header">
      <h3 id="chartTitle">选择一种材料</h3>
      <p class="pr-sub" id="chartSub">查看 n(λ) / k(λ) 色散曲线</p>
    </div>
    <div class="pr-body">
      <canvas id="chart"></canvas>
      <div class="pr-placeholder" id="prph">← 选择材料</div>
    </div>
    <div class="pr-legend" id="legendBar">
      <span><span class="dot" style="background:#4fc3f7"></span> n（折射率）</span>
      <span><span class="dot" style="background:rgba(255,138,101,.8)"></span> k（消光系数）</span>
    </div>
  </div>
</div>

<script>
// ============ Data Loading ============
let allMaterials = [];
let currentMaterial = null;
let currentDatasetIdx = 0;
let chartW = 0, chartH = 0;
let chartReady = false;

const CAT_LABELS = {all:'全部',glass:'光学玻璃',crystal:'晶体',semiconductor:'半导体',metal:'金属',polymer:'聚合物',other:'其他'};

const CN_ALIASES = {
  '石英':['SiO2'],'熔石英':['SiO2'],'二氧化硅':['SiO2'],
  '硅':['Si'],'锗':['Ge'],'氟化镁':['MgF2'],'二氧化钛':['TiO2'],
  '蓝宝石':['Al2O3'],'氧化铝':['Al2O3'],'金刚石':['Diamond'],'钻石':['Diamond'],
  '硒化锌':['ZnSe'],'硫化锌':['ZnS'],'氟化钙':['CaF2'],'萤石':['CaF2'],
  '氟化钡':['BaF2'],'氮化硅':['Si3N4'],'氮化镓':['GaN'],'砷化镓':['GaAs'],
  '碳化硅':['SiC'],'铌酸锂':['LiNbO3'],
  '钇铝石榴石':['Y3Al5O12'],'YAG':['Y3Al5O12'],
  '硼硅玻璃':['optical/BK7'],'冕玻璃':['optical/BK7'],
  '金':['Au'],'银':['Ag'],'铜':['Cu'],'铝':['Al'],
  '水':['H2O'],'冰':['H2O'],'乙醇':['C2H5OH'],'酒精':['C2H5OH'],
  '聚碳酸酯':['PC'],'PC':['PC'],'PMMA':['PMMA'],'亚克力':['PMMA'],
  'PS':['PS'],'聚苯乙烯':['PS'],
  'PTFE':['PTFE'],'聚四氟乙烯':['PTFE'],'特氟龙':['PTFE'],
  'PVC':['PVC'],'聚氯乙烯':['PVC'],
  'ITO':['ITO'],'锑化铟':['InSb'],'碲化镉':['CdTe'],
  '硫化铅':['PbS'],'硒化铅':['PbSe'],'碘化铯':['CsI'],'溴化钾':['KBr'],
  '氯化钠':['NaCl'],'氟化锂':['LiF'],
};

async function init() {
  try {
    const resp = await fetch('data/index.json');
    allMaterials = await resp.json();
    document.getElementById('matCount').textContent = allMaterials.length;
    setupUI();
    // Auto-select SiO2 as default
    // Check URL hash for direct linking
    const hashId = window.location.hash.slice(1);
    const target = hashId ? allMaterials.find(m => m.id === decodeURIComponent(hashId)) : null;
    if (target) { setTimeout(() => selectMaterial(target), 200); }
    else { const sio2 = allMaterials.find(m => m.id === 'SiO2'); if (sio2) { setTimeout(() => selectMaterial(sio2), 200); } }
  } catch(e) {
    document.getElementById('matList').innerHTML = '<div class="no-r">⚠ 数据加载失败<br>请确认通过 http://localhost 访问</div>';
  }
}

// ============ Search & Filter ============
let currentCat = 'all';
let searchQuery = '';

function filterMaterials() {
  const q = searchQuery.toLowerCase().trim();
  let filtered = allMaterials;
  if (currentCat !== 'all') filtered = filtered.filter(m => m.category === currentCat);
  if (q) {
    let aliasIds = new Set();
    for (const [cnTerm, ids] of Object.entries(CN_ALIASES)) {
      if (cnTerm.includes(q) || q.includes(cnTerm)) for (const id of ids) aliasIds.add(id);
    }
    filtered = filtered.filter(m => {
      if (aliasIds.has(m.id)) return true;
      if (m.id.toLowerCase().includes(q)) return true;
      if (m.name_cn && m.name_cn.includes(q)) return true;
      for (const n of m.names_en) if (n.toLowerCase().includes(q)) return true;
      if (m.formula && m.formula.toLowerCase().includes(q)) return true;
      return false;
    });
  }
  return filtered;
}

function renderList() {
  const filtered = filterMaterials();
  const list = document.getElementById('matList');
  if (!filtered.length) { list.innerHTML = '<div class="no-r">没有匹配的材料</div>'; return; }
  const important = new Set(['SiO2','BK7','optical/BK7','SF11','MgF2','TiO2','Si','Ge','ZnSe','ZnS','CaF2','BaF2','Al2O3','Si3N4','Ta2O5','HfO2','LiF','GaAs','LiNbO3','Y3Al5O12','Diamond','Au','Ag','Cu','H2O']);
  const sorted = [...filtered].sort((a,b) => (important.has(a.id)?0:1)-(important.has(b.id)?0:1) || a.id.localeCompare(b.id));
  let html = '';
  for (const m of sorted) {
    const active = (currentMaterial && currentMaterial.id === m.id) ? ' active' : '';
    const cnSpan = m.name_cn ? `<span class="cn">${m.name_cn}</span>` : '';
    const wl = (m.wl_min && m.wl_max) ? `${m.wl_min.toFixed(2)}–${m.wl_max.toFixed(1)}μm` : '';
    const catLabel = CAT_LABELS[m.category] || m.category;
    html += `<div class="mat-item${active}" data-id="${m.id}"><div class="mt">${m.formula||m.id} ${cnSpan}</div><div class="mm"><span>${catLabel}</span><span>${wl}</span><span>${m.dataset_count} 源</span></div></div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('.mat-item').forEach(item => {
    item.addEventListener('click', () => {
      const id = item.dataset.id;
      selectMaterial(allMaterials.find(m => m.id === id));
    });
  });
}

function renderCatTags() {
  const counts = {all:allMaterials.length};
  for (const m of allMaterials) counts[m.category] = (counts[m.category]||0)+1;
  let html = '';
  for (const [cat, label] of Object.entries(CAT_LABELS)) {
    if (!counts[cat]) continue;
    const active = currentCat === cat ? ' active' : '';
    html += `<button class="cat-tag${active}" data-cat="${cat}">${label} (${counts[cat]})</button>`;
  }
  document.getElementById('catTags').innerHTML = html;
  document.querySelectorAll('.cat-tag').forEach(tag => {
    tag.addEventListener('click', () => { currentCat = tag.dataset.cat; renderCatTags(); renderList(); });
  });
}

// ============ Material Selection ============
let _abortCtrl = null;
async function selectMaterial(mat) {
  if (mat) { window.location.hash = '#' + encodeURIComponent(mat.id); }
  currentMaterial = mat;
  currentDatasetIdx = 0;
  if (_abortCtrl) { _abortCtrl.abort(); }
  _abortCtrl = new AbortController();
  const signal = _abortCtrl.signal;
  let dataFile = mat.id.replace(/[/\\]/g, '_') + '.json';
  document.getElementById('detailPlaceholder').innerHTML = '<div class="no-r">⏳ 加载中...</div>';
  document.getElementById('detailPlaceholder').style.display = 'flex';
  try { const resp = await fetch('data/' + dataFile, { signal }); mat._datasets = await resp.json(); }
  catch(e) { if (e.name === 'AbortError') return; try { const resp = await fetch('data/org_' + dataFile, { signal }); mat._datasets = await resp.json(); } catch(e2) { if (e2.name === 'AbortError') return; mat._datasets = []; } }
  
  // Auto-select best dataset: prefer visible-range + formula1
  // For semiconductors (Si, Ge, GaAs etc): prefer datasets covering telecom band (1.3-1.55 μm)
  if (mat._datasets && mat._datasets.length > 1) {
    let bestIdx = 0;
    let bestScore = -1;
    const isSemiconductor = (mat.category === 'semiconductor' || mat.category === 'crystal');
    for (let i = 0; i < mat._datasets.length; i++) {
      const ds = mat._datasets[i];
      let score = 0;
      // Prefer data that covers visible (0.4-0.7 μm)
      if (ds.wl_min && ds.wl_min <= 0.5 && ds.wl_max && ds.wl_max >= 0.7) score += 10;
      // For semiconductors: prefer datasets covering telecom band
      if (isSemiconductor && ds.wl_min && ds.wl_max && ds.wl_min <= 1.3 && ds.wl_max >= 1.55) score += 8;
      // Prefer formula over tabulated (more compact)
      if (ds.type && ds.type.startsWith('formula')) score += 5;
      // Prefer data with both n and k (full nk datasets)
      if (ds.type && ds.type.includes('nk')) score += 2;
      // Slight preference for tabulated_k over none
      if (ds.type === 'tabulated_nk') score += 1;
      // Penalize very narrow wavelength ranges
      if (ds.wl_min && ds.wl_max && (ds.wl_max - ds.wl_min) < 0.3) score -= 3;
      // Tiebreak: prefer wider wavelength range
      if (score > bestScore || (score === bestScore && ds.wl_max - ds.wl_min > (mat._datasets[bestIdx].wl_max||0) - (mat._datasets[bestIdx].wl_min||0))) {
        bestScore = score; bestIdx = i;
      }
    }
    currentDatasetIdx = bestIdx;
  }
  renderList();
  renderDetail();
  renderChart();
}

// ============ Detail Panel ============
function renderDetail() {
  const ph = document.getElementById('detailPlaceholder');
  const ct = document.getElementById('detailContent');
  if (!currentMaterial || !currentMaterial._datasets || !currentMaterial._datasets.length) {
    ph.style.display = 'flex'; ct.classList.remove('active'); return;
  }
  ph.style.display = 'none'; ct.classList.add('active');
  const m = currentMaterial;
  const ds = m._datasets[currentDatasetIdx];
  document.getElementById('detailTitle').textContent = m.formula + (m.name_cn ? ' · ' + m.name_cn : '');
  const dirStr = ds.direction ? (ds.direction==='e'?' · e光（异常光）':' · o光（寻常光）') : '';
  document.getElementById('detailSub').textContent = (ds.ref_short||ds.source) + dirStr;
  
  let html = '<div class="detail-grid">';
  html += `<div class="di"><span class="dl">标识</span><span class="dv">${m.id}</span></div>`;
  html += `<div class="di"><span class="dl">化学式</span><span class="dv">${m.formula||'-'}</span></div>`;
  if (m.name_cn) html += `<div class="di"><span class="dl">中文名</span><span class="dv">${m.name_cn}</span></div>`;
  html += `<div class="di"><span class="dl">分类</span><span class="dv">${CAT_LABELS[m.category]||m.category}</span></div>`;
  if (m.wl_min) html += `<div class="di"><span class="dl">覆盖波长</span><span class="dv">${m.wl_min.toFixed(2)} – ${m.wl_max.toFixed(1)} μm</span></div>`;
  if (ds.direction) html += `<div class="di"><span class="dl">偏振</span><span class="dv">${dirStr.replace(' · ','')} <span class="aniso-badge">各向异性</span></span></div>`;
  html += `<div class="di"><span class="dl">数据源</span><span class="dv">${ds.ref_short||ds.source}</span></div>`;
  
  if (ds.type && ds.type.startsWith('formula') && ds.coeffs) {
    html += '<div class="coeff-box">';
    if (ds.type === 'formula1') {
      html += 'Sellmeier: n² = 1 + B₁λ²/(λ²-C₁²) + B₂λ²/(λ²-C₂²) + B₃λ²/(λ²-C₃²) (λ: μm)<br>';
      const lbl = ['B₁','C₁','B₂','C₂','B₃','C₃'];
      for (let i=0;i<ds.coeffs.length;i++) html += `${lbl[i]} = ${ds.coeffs[i]}<br>`;
    } else if (ds.type === 'formula2') {
      const c = ds.coeffs;
      if (c.length >= 7) {
        html += `Sellmeier: n² = 1 + B₁λ²/(λ²-C₁) + B₂λ²/(λ²-C₂) + B₃λ²/(λ²-C₃) (λ: μm)<br>`;
        html += `B₁=${c[1]}  C₁=${c[2]} μm² (λ₀=${Math.sqrt(c[2]).toFixed(4)} μm)<br>`;
        html += `B₂=${c[3]}  C₂=${c[4]} μm² (λ₀=${Math.sqrt(c[4]).toFixed(4)} μm)<br>`;
        html += `B₃=${c[5]}  C₃=${c[6]} μm² (λ₀=${Math.sqrt(c[6]).toFixed(4)} μm)`;
      } else if (c.length >= 5) {
        html += `Sellmeier-2: n² = A + B·λ²/(λ²-C) + D·λ²/(λ²-E) (λ: μm)<br>`;
        html += `A = ${(1 + c[0]).toFixed(8)}  B = ${c[1]}<br>`;
        html += `C = ${c[2]} μm² (λ₀ = ${Math.sqrt(Math.max(c[2],0)).toFixed(4)} μm)<br>`;
        html += `D = ${c[3]}  E = ${c[4]} μm² (λ₀ = ${Math.sqrt(Math.max(c[4],0)).toFixed(4)} μm)`;
      }
    } else if (ds.type === 'formula4') {
      html += `n² = A + B₁/(λ²-C₁) + B₂/(λ²-C₂) + D·λ<sup>E</sup> (λ: μm)<br>A=${ds.coeffs[0]}  B₁=${ds.coeffs[1]}  C₁=${ds.coeffs[3]}  B₂=${ds.coeffs[5]}  C₂=${ds.coeffs[7]}<br>D=${ds.coeffs[9]}  E=${ds.coeffs[10]}`;
    }
    html += '<button class="copy-btn" onclick="copyCoeffs()">📋 复制</button></div>';
  }
  
  // === Key wavelength n values ===
  const keyWavelengths = [0.38, 0.55, 0.78, 1.0, 2.0, 4.0, 10.0];
  html += '<div class="n-values">';
  for (const wl of keyWavelengths) {
    if (ds.wl_min && wl < ds.wl_min - 0.01) continue;
    if (ds.wl_max && wl > ds.wl_max + 0.01) continue;
    let n = null, k = null;
    const ri = calcRI(ds, wl);
    n = ri.n; k = ri.k;
    if (n !== null) {
      const wlStr = wl >= 1 ? wl.toFixed(1) + 'μm' : (wl*1000).toFixed(0) + 'nm';
      html += `<div class="nv-item"><span class="nv-wl">${wlStr}</span><span class="nv-n">${n.toFixed(4)}</span>`;
      if (k !== null && k > 1e-6) html += `<span class="nv-k">k=${k.toExponential(2)}</span>`;
      else if (ds.pts && ds.pts[0] && ds.pts[0].length > 2) html += '<span class="nv-k">k≈0</span>';
      html += '</div>';
    }
  }
  html += '</div>';
  
  // === Wavelength calculator ===
  html += '<div class="wl-calc"><span class="wl-calc-label">自定义波长 (μm): </span>';
  html += '<input type="number" id="wlInput" class="wl-calc-input" value="0.55" min="0.1" max="50" step="0.001" onchange="calcWavelength()" oninput="calcWavelength()">';
  html += '<span class="wl-calc-result" id="wlResult">n = —</span></div>';
  setTimeout(calcWavelength, 100);
  
  // === Tabulated data table (show first 30 rows, click to expand) ===
  if (ds.pts && ds.pts.length > 0) {
    const totalRows = ds.pts.length;
    const showAll = (typeof detailShowAll !== 'undefined' && detailShowAll);
    const showRows = showAll ? totalRows : Math.min(totalRows, 30);
    html += '<table class="data-table"><thead><tr>';
    html += '<th>波长 (μm)</th><th>n</th>';
    if (ds.pts[0].length > 2) html += '<th>k</th>';
    html += '</tr></thead><tbody id="dataTableBody">';
    for (let i = 0; i < showRows; i++) {
      const pt = ds.pts[i];
      html += '<tr><td>' + pt[0].toFixed(4) + '</td><td>' + pt[1].toFixed(5);
      if (pt.length > 2) html += '</td><td>' + pt[2].toExponential(3);
      html += '</td></tr>';
    }
    html += '</tbody></table>';
    if (totalRows > 30) {
      html += `<button class="copy-btn" onclick="toggleAllData(${totalRows})" style="position:static;display:block;margin:6px auto 0;padding:5px 14px;font-size:10px">`;
      html += showAll ? '收起' : `展开全部 ${totalRows} 行`;
      html += '</button>';
    }
  }
  
  // Full ref (show partial, strip HTML tags)
  if (ds.ref_full) {
    const cleanRef = ds.ref_full.replace(/<[^>]*>/g, '').substring(0, 400);
    html += `<div class="di" style="grid-column:1/-1"><span class="dl">原始论文</span><span class="dv" style="font-size:10px;color:#999">${cleanRef}</span></div>`;
  }
  
  if (ds.comments) {
    html += `<div class="di" style="grid-column:1/-1"><span class="dl">备注</span><span class="dv" style="font-size:9px">${ds.comments}</span></div>`;
  }
  
  if (m._datasets.length > 1) {
    html += '<div class="src-list"><span class="dl" style="color:#555;font-size:9px">切换数据源</span>';
    for (let i=0;i<m._datasets.length;i++) {
      const src = m._datasets[i];
      const act = i===currentDatasetIdx?' active':'';
      html += `<div class="src-item${act}" data-idx="${i}"><span>${src.ref_short||src.source}${src.direction?' ['+src.direction+']':''}</span><span class="sm">${src.wl_min?src.wl_min.toFixed(2)+'–'+src.wl_max.toFixed(1)+'μm':''}</span></div>`;
    }
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('detailBody').innerHTML = html;
  
  document.querySelectorAll('.src-item').forEach(item => {
    item.addEventListener('click', () => { currentDatasetIdx = parseInt(item.dataset.idx); renderDetail(); renderChart(); });
  });
}

let detailShowAll = false;

function toggleAllData(totalRows) {
  detailShowAll = !detailShowAll;
  renderDetail();
  // Scroll data table into view
  setTimeout(() => {
    const table = document.querySelector('.data-table');
    if (table) table.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function calcWavelength() {
  if (!currentMaterial) return;
  const ds = currentMaterial._datasets[currentDatasetIdx];
  if (!ds) return;
  const wl = parseFloat(document.getElementById('wlInput').value);
  if (isNaN(wl) || wl <= 0) { document.getElementById('wlResult').innerHTML = 'n = —'; return; }
  if (ds.wl_min && wl < ds.wl_min - 0.01) { document.getElementById('wlResult').innerHTML = 'n = — <span style="font-size:10px;color:#ff5252">(超出范围)</span>'; return; }
  if (ds.wl_max && wl > ds.wl_max + 0.01) { document.getElementById('wlResult').innerHTML = 'n = — <span style="font-size:10px;color:#ff5252">(超出范围)</span>'; return; }
  const ri = calcRI(ds, wl);
  if (ri.n !== null) {
    document.getElementById('wlResult').innerHTML = 'n = <b>' + ri.n.toFixed(5) + '</b>';
    if (ri.k !== null && ri.k > 1e-6) document.getElementById('wlResult').innerHTML += '  k = ' + ri.k.toExponential(2);
  } else {
    document.getElementById('wlResult').innerHTML = 'n = —';
  }
}

function copyCoeffs() {
  if (!currentMaterial) return;
  const ds = currentMaterial._datasets[currentDatasetIdx];
  if (!ds||!ds.coeffs) return;
  navigator.clipboard.writeText(ds.coeffs.join(' '));
  const btn = document.querySelector('.copy-btn');
  if (btn) { btn.textContent = '✓ 已复制'; setTimeout(() => btn.textContent = '📋 复制', 1500); }
}

// ============ Chart ============
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let padL, padR, padT, padB;

function sellmeier1(lambda_um, coeffs) {
  if (!coeffs || coeffs.length < 6) return 1;
  const [B1, C1, B2, C2, B3, C3] = coeffs;
  const l2 = lambda_um * lambda_um;
  const n2 = 1 + B1*l2/(l2 - C1*C1) + B2*l2/(l2 - C2*C2) + B3*l2/(l2 - C3*C3);
  return Math.sqrt(Math.max(n2, 0));
}
function calcRI(ds, wl) {
  if (!ds) return { n: null, k: null };
  const l2 = wl * wl;
  let n = null, k = null;
  if (ds.type === 'formula1') {
    n = sellmeier1(wl, ds.coeffs);
  } else if (ds.type === 'formula2' && ds.coeffs && ds.coeffs.length >= 5) {
    const c = ds.coeffs;
    n = Math.sqrt(Math.max(1 + c[0] + c[1]*l2/(l2-c[2]) + c[3]*l2/(l2-c[4]), 0));
  } else if (ds.type === 'formula4' && ds.coeffs && ds.coeffs.length >= 11) {
    const c = ds.coeffs;
    n = Math.sqrt(Math.max(c[0] + c[1]/(l2-c[3]) + c[5]/(l2-c[7]) + c[9]*Math.pow(l2, c[10]/2), 0));
  } else if (ds.pts && ds.pts.length) {
    let bestDist = Infinity;
    for (const pt of ds.pts) {
      const dist = Math.abs(pt[0] - wl);
      if (dist < bestDist) { bestDist = dist; n = pt[1]; k = pt.length > 2 ? pt[2] : null; }
    }
  }
  return { n, k };
}


function renderChart() {
  const prph = document.getElementById('prph');
  const leg = document.getElementById('legendBar');
  
  if (!chartReady || !currentMaterial || !currentMaterial._datasets || !currentMaterial._datasets.length) {
    prph.style.display = 'flex'; leg.classList.remove('show'); ctx.clearRect(0,0,chartW,chartH); return;
  }
  
  prph.style.display = 'none'; leg.classList.add('show');
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const ds = currentMaterial._datasets[currentDatasetIdx];
  if (!ds) return;
  
  document.getElementById('chartTitle').textContent = currentMaterial.formula + (currentMaterial.name_cn?' · '+currentMaterial.name_cn:'');
  const dirStr = ds.direction ? (ds.direction==='e'?'e光':'o光') + ' · ' : '';
  document.getElementById('chartSub').textContent = dirStr + (ds.ref_short||ds.source);
  
  ctx.clearRect(0, 0, chartW, chartH);
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, chartW, chartH);
  
  let wlMin = ds.wl_min || 0.2, wlMax = ds.wl_max || 20;
  const pad = (wlMax - wlMin) * 0.05;
  const xMin = Math.max(0.1, wlMin - pad), xMax = wlMax + pad;
  
  function xForWl(wl) { return padL + Math.log10(wl/xMin) / Math.log10(xMax/xMin) * (chartW - padL - padR); }
  
  let yMax = 1, kHas = false;
  if (ds.type && ds.type.startsWith('formula')) {
    for (let i = 0; i <= 500; i++) {
      const wl = wlMin + (wlMax - wlMin) * i / 500;
      let n = 1;
      n = calcRI(ds, wl).n || 1;
      if (n > yMax) yMax = n;
    }
  } else if (ds.pts) {
    for (const pt of ds.pts) {
      if (pt[1] > yMax) yMax = pt[1];
      if (pt.length > 2 && pt[2] > 1e-6) kHas = true;
    }
  }
  yMax = Math.ceil(yMax * 1.15); if (yMax < 1.5) yMax = 1.5;
  
  function yForN(n) { return padT + (1 - n/yMax) * (chartH - padT - padB); }
  
  // Grid
  ctx.strokeStyle = '#1e1e2a'; ctx.lineWidth = 1.5;
  const fontSize = Math.max(12*dpr, 11);
  ctx.font = `600 ${fontSize}px Inter, sans-serif`;
  for (let n = 1; n <= yMax; n += (yMax > 5 ? 1 : 0.5)) {
    const y = yForN(n);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(chartW-padR, y); ctx.stroke();
    ctx.fillStyle = '#bbb'; ctx.textAlign = 'right';
    ctx.fillText(n.toFixed(1), padL - 10*dpr, y + 4*dpr);
  }
  
  // X axis (log scale)
  for (let d = Math.floor(Math.log10(xMin)); d <= Math.ceil(Math.log10(xMax)); d++) {
    for (let m = 1; m < 10; m++) {
      const val = m * Math.pow(10, d);
      if (val < xMin || val > xMax) continue;
      const x = xForWl(val);
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, chartH-padB);
      ctx.strokeStyle = (val===1||val===10) ? '#1e1e2a' : '#151520'; ctx.stroke();
      ctx.fillStyle = '#aaa'; ctx.textAlign = 'center';
      ctx.fillText(val>=1 ? val.toFixed(val<10?1:0) : val.toFixed(1), x, chartH-padB+20*dpr);
    }
  }
  
  // Axis labels
  const labelFont = Math.max(14*dpr, 13);
  ctx.fillStyle = '#ccc'; ctx.textAlign = 'center';
  ctx.font = `600 ${labelFont}px Inter, sans-serif`;
  ctx.fillText('波长 (μm)', chartW/2, chartH - 6*dpr);
  ctx.save(); ctx.translate(14*dpr, chartH/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('折射率 n / 消光系数 k', 0, 0); ctx.restore();
  
  // Visible highlight
  const visStart = xForWl(0.38), visEnd = xForWl(0.78);
  ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(visStart, padT, visEnd-visStart, chartH-padT-padB);
  ctx.fillStyle = '#888'; ctx.textAlign = 'center';
  ctx.font = `600 ${Math.max(12*dpr,11)}px Inter, sans-serif`;
  ctx.fillText('可见光', (visStart+visEnd)/2, padT+16*dpr);
  
  // Cutoff lines
  ctx.setLineDash([2*dpr,5*dpr]); ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(xForWl(wlMin), padT); ctx.lineTo(xForWl(wlMin), chartH-padB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xForWl(wlMax), padT); ctx.lineTo(xForWl(wlMax), chartH-padB); ctx.stroke();
  ctx.setLineDash([]);
  
  // n curve
  ctx.beginPath(); ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2.5;
  let first = true;
  if (ds.type && ds.type.startsWith('formula')) {
    for (let i = 0; i <= 500; i++) {
      const wl = wlMin + (wlMax-wlMin)*i/500;
      let n = 1;
      n = calcRI(ds, wl).n || 1;
      const x=xForWl(wl),y=yForN(Math.min(n,yMax));
      if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
    }
  } else if (ds.pts) {
    for (const pt of ds.pts) {
      if(pt[0]<wlMin||pt[0]>wlMax) continue;
      const x=xForWl(pt[0]),y=yForN(Math.min(pt[1],yMax));
      if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
    }
  }
  ctx.stroke();
  
  // k curve
  if (kHas && ds.pts) {
    ctx.beginPath(); ctx.strokeStyle = 'rgba(255,138,101,0.7)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4*dpr,4*dpr]);
    first = true;
    for (const pt of ds.pts) {
      if (pt.length>2 && pt[2]>1e-6 && pt[0]>=wlMin && pt[0]<=wlMax) {
        const kLog = Math.log10(pt[2]), kNorm = Math.max(0, Math.min((kLog+4)/4,1));
        const x=xForWl(pt[0]),yK=yForN(kNorm*yMax*0.5);
        if(first){ctx.moveTo(x,yK);first=false}else ctx.lineTo(x,yK);
      }
    }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `${fontSize}px Inter, sans-serif`; ctx.fillStyle = 'rgba(255,138,101,0.9)'; ctx.textAlign = 'left';
    ctx.fillText('k (对数)', chartW-padR-60*dpr, padT+14*dpr);
  }
}

function resizeChart() {
  const body = document.querySelector('.pr-body');
  const rect = body.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const availW = rect.width - 16;
  const availH = rect.height - 16;
  canvas.width = Math.max(availW*dpr, 200);
  canvas.height = Math.max(availH*dpr, 200);
  canvas.style.width = availW + 'px';
  canvas.style.height = availH + 'px';
  chartW = canvas.width; chartH = canvas.height;
  const baseFont = Math.max(12, availH/30);
  padL = baseFont*6*dpr; padR = Math.max(baseFont*3*dpr, 30); padT = baseFont*2.5*dpr; padB = baseFont*5*dpr;
  chartReady = true;
  renderChart();
}

// ============ Setup ============
function setupUI() {
  renderCatTags(); renderList();
  let searchTimer = null;
  document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(renderList, 250); });
  window.addEventListener('resize', resizeChart);
  resizeChart();
}
init();
</script>
