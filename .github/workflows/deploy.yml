name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/admin/opticskit

            # Pull latest code
            git fetch origin main && git reset --hard origin/main

            # Install dependencies (if needed)
            npm install --prefer-offline

            # Build with timeout (5 minutes max)
            timeout 300 npm run build || {
              echo BUILD FAILED - rolling back to previous commit
              git reset --hard HEAD~1
              npm run build
              sudo systemctl restart opticskit
              exit 1
            }

            # Verify .next directory exists
            if [ ! -f .next/BUILD_ID ]; then
              echo BUILD_ID missing - build may have failed silently
              exit 1
            fi

            # Restart service
            sudo systemctl restart opticskit
            sleep 5

            # Health check
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed: HTTP $STATUS"
              exit 1
            fi

            echo "Deploy complete - HTTP $STATUS"
