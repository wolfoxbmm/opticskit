server {
    server_name opticskit.cn www.opticskit.cn;
    if ($block_scanner) { return 444; }

    # Umami tracker script (static file)
    location = /umami.js {
        root /var/www/opticskit/public;
    }

    # Umami Analytics API endpoint
    location /api/send {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static tool HTML files from public directory
    location ~ ^/tools/.*\.html$ {
        root /home/admin/opticskit/public;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/opticskit.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opticskit.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.opticskit.cn) {
        return 301 https://$host$request_uri;
    }
    if ($host = opticskit.cn) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name opticskit.cn www.opticskit.cn;
    if ($block_scanner) { return 444; }
    return 404;
}
